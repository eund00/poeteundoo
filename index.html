      <script>
        fetch("./works.json")
          .then((response) => response.json())
          .then((works) => {
            const workList = document.getElementById("work-list");
            const prevButton = document.getElementById("work-prev");
            const nextButton = document.getElementById("work-next");

            // 최신 작품부터 표시
            works.reverse();

            const totalCount = works.length;

            // 배경 이미지 번호 섞기
            const imageNumbers = Array.from(
              { length: totalCount },
              (_, index) => index + 1,
            );

            imageNumbers.sort(() => Math.random() - 0.5);

            works.forEach((work, index) => {
              const article = document.createElement("article");
              article.className = "work-card";

              const randomNumber = imageNumbers[index];

              article.innerHTML = `
          <a href="./work.html?id=${work.id}">
            <div class="work-card__meta"
              style="display:flex; justify-content:space-between; align-items:baseline;">
              <div>
                <span>${work.year}</span>
                <span> · </span>
                <span>${work.publication}</span>
              </div>

              <span style="
                flex-shrink:0;
                background:#739b73;
                padding:2px 10px;
                border-radius:25px;
                color:#fff;
                margin-left:1vw;
                font-size:14px;">
                ${work.kind}
              </span>

              <img
                class="bg_img"
                src="img/img_bg (${randomNumber}).jpeg"
                alt=""
              >
            </div>

            <h3 class="work-card__title">${work.title}</h3>

            <p class="work-card__excerpt">
              ${work.subtitle}
            </p>
          </a>
        `;

              workList.appendChild(article);
            });

            let currentIndex = 0;

            function getVisibleCount() {
              return window.innerWidth <= 768 ? 1 : 3;
            }

            function updateSlider() {
              const cards = workList.querySelectorAll(".work-card");
              const visibleCount = getVisibleCount();
              const maxIndex = Math.max(0, totalCount - visibleCount);

              currentIndex = Math.min(currentIndex, maxIndex);

              if (cards.length === 0) return;

              const cardWidth = cards[0].getBoundingClientRect().width;
              const gap = parseFloat(getComputedStyle(workList).gap) || 0;

              workList.style.transform = `translateX(-${currentIndex * (cardWidth + gap)}px)`;

              prevButton.disabled = currentIndex === 0;
              nextButton.disabled = currentIndex >= maxIndex;

              prevButton.style.opacity = prevButton.disabled ? "0.3" : "1";
              nextButton.style.opacity = nextButton.disabled ? "0.3" : "1";
            }

            prevButton.addEventListener("click", () => {
              currentIndex = Math.max(0, currentIndex - 1);
              updateSlider();
            });

            nextButton.addEventListener("click", () => {
              const maxIndex = Math.max(0, totalCount - getVisibleCount());

              currentIndex = Math.min(maxIndex, currentIndex + 1);
              updateSlider();
            });

            window.addEventListener("resize", updateSlider);

            // 마우스 드래그 + 모바일 터치 스와이프
            let startX = 0;
            let isDragging = false;
            let dragMoved = false;

            // 드래그 시작
            workList.addEventListener("pointerdown", (event) => {
              // 마우스는 왼쪽 버튼만 허용
              if (event.pointerType === "mouse" && event.button !== 0) {
                return;
              }

              startX = event.clientX;
              isDragging = true;
              dragMoved = false;

              workList.setPointerCapture(event.pointerId);
              clearInterval(autoSlide);
            });

            // 드래그 중
            workList.addEventListener("pointermove", (event) => {
              if (!isDragging) return;

              const diff = startX - event.clientX;

              if (Math.abs(diff) > 5) {
                dragMoved = true;
              }
            });

            // 드래그 종료
            workList.addEventListener("pointerup", (event) => {
              if (!isDragging) return;

              const diff = startX - event.clientX;
              isDragging = false;

              if (Math.abs(diff) >= 50) {
                const maxIndex = Math.max(0, totalCount - getVisibleCount());

                if (diff > 0) {
                  currentIndex = Math.min(maxIndex, currentIndex + 1);
                } else {
                  currentIndex = Math.max(0, currentIndex - 1);
                }

                updateSlider();
              }

              startAutoSlide();
            });

            // 드래그 취소 대응
            workList.addEventListener("pointercancel", () => {
              isDragging = false;
              startAutoSlide();
            });

            // 드래그 직후 링크가 클릭되는 것 방지
            workList.addEventListener(
              "click",
              (event) => {
                if (dragMoved) {
                  event.preventDefault();
                  event.stopPropagation();
                  dragMoved = false;
                }
              },
              true,
            );

            updateSlider();

            // 0.8초마다 자동 슬라이드
            let autoSlide;

            function startAutoSlide() {
              clearInterval(autoSlide);

              autoSlide = setInterval(() => {
                const maxIndex = Math.max(0, totalCount - getVisibleCount());

                if (maxIndex === 0) return;

                currentIndex = currentIndex >= maxIndex ? 0 : currentIndex + 1;

                updateSlider();
              }, 3000);
            }

            // 자동 슬라이드 시작
            startAutoSlide();

            // 마우스를 올리면 정지
            const viewport = document.querySelector(".work-slider__viewport");

            viewport.addEventListener("mouseenter", () => {
              clearInterval(autoSlide);
            });

            // 마우스가 벗어나면 재개
            viewport.addEventListener("mouseleave", () => {
              startAutoSlide();
            });
          })
          .catch((error) => {
            console.error("작품 데이터를 불러오지 못했습니다.", error);
          });
      </script>
