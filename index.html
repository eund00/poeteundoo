<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <h1 class="logo">
          <a href="/">LEE EUN JOO</a>
        </h1>

        <nav class="gnb">
          <ul class="gnb__list">
            <li class="gnb__item">
              <a href="/works">Works</a>
            </li>
            <li class="gnb__item">
              <a href="/about">About</a>
            </li>
            <li class="gnb__item">
              <a href="/interview">Interview</a>
            </li>
            <li class="gnb__item">
              <a href="/archive">Archive</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <!-- 메인 -->
      <section class="hero">
        <div class="hero__inner">
          <p class="hero__eyebrow">POET / LEE EUN JOO</p>

          <h2 class="hero__title">
            시를 쓰고,<br />
            시를 남깁니다.
          </h2>

          <a href="/works" class="hero__link"> VIEW WORKS → </a>
        </div>
      </section>

      <!-- 최근 작품 -->
      <section class="latest-works">
        <div class="section-header">
          <p class="section-header__label">LATEST WORKS</p>
          <h2 class="section-header__title">최근 발표작</h2>
        </div>

        <div class="work-list">
          <article class="work-card">
            <a href="/works/01">
              <div class="work-card__meta">
                <span>2026</span>
                <span>《미래문학》</span>
              </div>

              <h3 class="work-card__title">시의 제목</h3>

              <p class="work-card__excerpt">시의 일부를 짧게 보여주는 영역</p>
            </a>
          </article>

          <article class="work-card">...</article>
        </div>
      </section>

      <!-- 작가 소개 -->
      <section class="about">
        <div class="about__inner">
          <div class="about__heading">
            <p>ABOUT</p>
            <h2>이은주</h2>
          </div>

          <div class="about__content">
            <p>시를 쓰고 있습니다.</p>

            <a href="/about"> MORE ABOUT → </a>
          </div>
        </div>
      </section>

      <!-- 인터뷰 -->
      <section class="interview">
        <div class="section-header">
          <p class="section-header__label">INTERVIEW</p>
          <h2 class="section-header__title">말과 기록</h2>
        </div>

        <ul class="interview-list">
          <li class="interview-item">
            <a href="/interview/01">
              <span class="interview-item__date">2026</span>
              <strong class="interview-item__title"> 인터뷰 제목 </strong>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <p class="footer__name">LEE EUN JOO</p>

        <p class="footer__copyright">© 2026 Lee Eun Joo</p>
      </div>
    </footer>
  </body>
</html>
