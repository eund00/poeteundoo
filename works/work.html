          <script>
            (() => {
              const icon = document.getElementById("weather-icon");
              const temp = document.getElementById("weather-temp");
              const mainBg = document.querySelector(".main_bg");

              if (!icon || !temp) return;

              // 서울의 현재 날씨와 일출·일몰 시간
              const weatherURL =
                "https://api.open-meteo.com/v1/forecast" +
                "?latitude=37.5665" +
                "&longitude=126.9780" +
                "&current=temperature_2m,weather_code,is_day" +
                "&daily=sunrise,sunset" +
                "&forecast_days=1" +
                "&timezone=Asia%2FSeoul";

              // 시간대별 배경 이미지
              const backgrounds = {
                dawn: "https://images.unsplash.com/photo-1720097805320-b2830f86b4f5?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                day: "https://images.unsplash.com/photo-1593617589445-a9cb66fbae15?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                evening:
                  "https://images.unsplash.com/photo-1763389568436-b31666c43ea5?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                night:
                  "https://images.unsplash.com/photo-1507400492013-162706c8c05e?q=80&w=659&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
              };

              // 시간대에 따라 배경 변경
              function changeBackground(sunrise, sunset) {
                if (!mainBg) return;

                // 현재 한국 시간
                const now = new Date();

                const time = new Intl.DateTimeFormat("ko-KR", {
                  timeZone: "Asia/Seoul",
                  hour: "2-digit",
                  minute: "2-digit",
                  hourCycle: "h23",
                }).format(now);

                const [hour, minute] = time.split(":").map(Number);
                const currentTime = hour * 60 + minute;

                // 일출·일몰 시간을 분 단위로 변환
                const sunriseTime = getMinutes(sunrise);
                const sunsetTime = getMinutes(sunset);

                let background;

                if (
                  currentTime >= sunriseTime - 60 &&
                  currentTime < sunriseTime
                ) {
                  // 일출 1시간 전부터: 새벽
                  background = backgrounds.dawn;
                } else if (
                  currentTime >= sunriseTime &&
                  currentTime < sunsetTime - 60
                ) {
                  // 일출부터 일몰 1시간 전까지: 낮
                  background = backgrounds.day;
                } else if (
                  currentTime >= sunsetTime - 60 &&
                  currentTime < sunsetTime + 90
                ) {
                  // 일몰 1시간 전부터 일몰 1시간 30분 후까지: 저녁
                  background = backgrounds.evening;
                } else {
                  // 그 외의 시간: 밤
                  background = backgrounds.night;
                }

                mainBg.style.backgroundImage = `url("${background}")`;
              }

              // API의 일출·일몰 시간을 분으로 변환
              function getMinutes(dateString) {
                const time = dateString.split("T")[1];
                const [hour, minute] = time.split(":").map(Number);

                return hour * 60 + minute;
              }

              // 날씨 코드에 따라 이모지 반환
              function getWeather(code, isDay) {
                // 0: 맑음
                if (code === 0) {
                  return isDay ? "☀️" : "🌙";
                }

                // 1: 대체로 맑음
                if (code === 1) {
                  return isDay ? "🌤️" : "🌙";
                }

                // 2: 부분적으로 흐림
                if (code === 2) return "⛅";

                // 3: 흐림
                if (code === 3) return "☁️";

                // 45, 48: 안개
                if ([45, 48].includes(code)) return "🌫️";

                // 51~57: 이슬비
                if ([51, 53, 55, 56, 57].includes(code)) {
                  return "🌦️";
                }

                // 61~67: 비
                if ([61, 63, 65, 66, 67].includes(code)) {
                  return "🌧️";
                }

                // 71~77: 눈
                if ([71, 73, 75, 77].includes(code)) {
                  return "❄️";
                }

                // 80~82: 소나기
                if ([80, 81, 82].includes(code)) {
                  return "🌧️";
                }

                // 85~86: 눈 소나기
                if ([85, 86].includes(code)) return "🌨️";

                // 95~99: 천둥번개
                if ([95, 96, 99].includes(code)) return "⛈️";

                return "☁️";
              }

              // 날씨 업데이트
              async function updateWeather() {
                try {
                  const response = await fetch(weatherURL);

                  if (!response.ok) {
                    throw new Error("날씨 API 요청 실패");
                  }

                  const data = await response.json();
                  const current = data.current;

                  if (!current) {
                    throw new Error("날씨 데이터 없음");
                  }

                  // 날씨 이모지 표시
                  const weatherIcon = getWeather(
                    current.weather_code,
                    current.is_day,
                  );

                  const temperature = Math.round(current.temperature_2m);
                  const weatherCode = current.weather_code;

                  // 날씨 문구 만들기
                  function getWeatherMessage(code, temp) {
                    // 비가 오는 날
                    if (
                      [
                        51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82,
                      ].includes(code)
                    ) {
                      return "🌧️ 비가 오니 우산을 꼭 챙기기!.";
                    }

                    // 눈이 오는 날
                    if ([71, 73, 75, 77, 85, 86].includes(code)) {
                      return "❄️ 눈이 와요. 휘엉청 조심!";
                    }

                    // 천둥번개가 치는 날
                    if ([95, 96, 99].includes(code)) {
                      return "⛈️ 우르르 쾅쾅!";
                    }

                    // 추운 날
                    if (temp <= 5) {
                      return "🧣 겉옷을 꼭 챙겨 입기!";
                    }

                    // 더운 날
                    if (temp >= 28) {
                      return "🍉 너무 더워요. 물을 자주 마셔요.";
                    }

                    // 맑은 날
                    if ([0, 1].includes(code)) {
                      return "☀️ 광합성하기 딱 좋은 날!";
                    }

                    // 흐린 날
                    if ([2, 3, 45, 48].includes(code)) {
                      return "☁️ 구름이 많아요. 마음만은 맑게!";
                    }

                    return "🌿 오늘도 무사히, 기분 좋은 하루 보내기!";
                  }

                  // 화면에 표시
                  icon.textContent = "";
                  temp.textContent = getWeatherMessage(
                    weatherCode,
                    temperature,
                  );

                  temp.title = "서울의 현재 날씨";

                  // 일출·일몰 시간에 따라 배경 변경
                  const sunrise = data.daily.sunrise[0];
                  const sunset = data.daily.sunset[0];

                  changeBackground(sunrise, sunset);
                } catch (error) {
                  console.error("날씨를 불러오지 못했습니다.", error);

                  icon.textContent = "🌿";
                  temp.textContent = "날씨를 쉬어가는 중";

                  // API 실패 시 시간대별 고정 시간으로 배경 변경
                  changeBackgroundByClock();
                }
              }

              // API 실패 시 사용하는 시간대별 배경
              function changeBackgroundByClock() {
                if (!mainBg) return;

                const now = new Date();

                const time = new Intl.DateTimeFormat("ko-KR", {
                  timeZone: "Asia/Seoul",
                  hour: "2-digit",
                  minute: "2-digit",
                  hourCycle: "h23",
                }).format(now);

                const [hour, minute] = time.split(":").map(Number);
                const currentTime = hour * 60 + minute;

                let background;

                if (currentTime >= 300 && currentTime < 600) {
                  // 05:00~09:59: 새벽
                  background = backgrounds.dawn;
                } else if (currentTime >= 600 && currentTime < 1800) {
                  // 10:00~17:59: 낮
                  background = backgrounds.day;
                } else if (currentTime >= 1800 && currentTime < 2100) {
                  // 18:00~20:59: 저녁
                  background = backgrounds.evening;
                } else {
                  // 21:00~04:59: 밤
                  background = backgrounds.night;
                }

                mainBg.style.backgroundImage = `url("${background}")`;
              }

              // 처음 접속했을 때 날씨 불러오기
              updateWeather();

              // 30분마다 날씨 업데이트
              setInterval(updateWeather, 30 * 60 * 1000);

              // 1분마다 시간대 확인
              setInterval(() => {
                changeBackgroundByClock();
              }, 60 * 1000);
            })();
          </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      document.addEventListener("DOMContentLoaded", initWorkList);

      // 작품 목록 초기화
      async function initWorkList() {
        const workList = document.getElementById("work-list");

        if (!workList) return;

        try {
          const db = window.supabase.createClient(
            "https://jxyucxgpdlfidzwizski.supabase.co",
            "sb_publishable_hhdmoi0xScMatNS8Nb9ZVA_FG-DQoG-",
          );
          const { data: works, error } = await db
            .from("works")
            .select("id, title, year, kind, publication, subtitle")
            .eq("is_published", true)
            .order("id", { ascending: false });

          if (error) throw error;

          if (!works.length) return;

          renderWorks(works, workList);
        } catch (error) {
          console.error("작품 데이터를 불러오지 못했습니다.", error);
        }
      }

      // 작품 카드 렌더링
      function renderWorks(works, workList) {
        // 배경 이미지 번호 생성
        const imageNumbers = Array.from(
          { length: works.length },
          (_, index) => index + 1,
        );

        // 배경 이미지 번호 무작위 배정
        for (let i = imageNumbers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));

          [imageNumbers[i], imageNumbers[j]] = [
            imageNumbers[j],
            imageNumbers[i],
          ];
        }

        const fragment = document.createDocumentFragment();

        works.forEach((work, index) => {
          const card = document.createElement("article");
          card.className = "work-card";

          // 작품 링크
          const link = document.createElement("a");
          link.className = "work-card__link";
          link.href = `work-detail.html?id=${encodeURIComponent(work.id)}`;

          // 배경 이미지
          const background = document.createElement("img");
          background.className = "work-card__background";
          background.src = `../img/img_bg (${imageNumbers[index]}).jpeg`;
          background.alt = "";
          background.draggable = false;

          // 작품 정보
          const meta = document.createElement("div");
          meta.className = "work-card__meta";

          const publication = document.createElement("div");
          publication.className = "work-card__publication";

          const year = document.createElement("span");
          year.textContent = work.year ?? "";

          const separator = document.createElement("span");
          separator.textContent = " · ";
          separator.setAttribute("aria-hidden", "true");

          const publicationName = document.createElement("span");
          publicationName.textContent = work.publication ?? "";

          publication.append(year, separator, publicationName);

          // 작품 종류
          const type = document.createElement("span");
          type.className = "work-card__type";
          type.textContent = work.kind ?? "";

          meta.append(publication, type);

          // 작품 제목
          const title = document.createElement("h3");
          title.className = "work-card__title";
          title.textContent = work.title ?? "";

          // 작품 요약
          const excerpt = document.createElement("p");
          excerpt.className = "work-card__excerpt";
          excerpt.textContent = work.subtitle ?? "";

          // 카드 조립
          link.append(background, meta, title, excerpt);
          card.appendChild(link);
          fragment.appendChild(card);
        });

        workList.replaceChildren(fragment);
      }
    </script>
