    <!-- 기본 설정 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>읽어봐요 : 은듀닷컴</title>

    <!-- 파비콘 -->
    <link rel="icon" type="image/png" href="../img/favicon.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/fonts.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Dongle&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu&family=Gothic+A1&family=IBM+Plex+Sans+KR&display=swap"
      rel="stylesheet"
    />

    <!-- 페이지 스타일 -->
    <style>
      /* ==============================
         작품 상세 페이지
      ============================== */

      .work-bg {
        background-image: url(https://images.unsplash.com/photo-1783700697126-8055c3c15baa?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);
      }
      .work-detail {
        width: min(550px, calc(100% - 80px));
        margin: 0 auto;
        padding: 0 2rem 2rem;
        background-color: rgb(255 255 255 / 45%);
        margin: 90px auto 20px;
        border-radius: 5px;
      }

      /* ==============================
         작품 헤더
      ============================== */

      .work-detail__header {
        padding-bottom: 30px;
        margin-top: 35px;
        border-bottom: 1px solid #111;
      }

      .work-detail__meta {
        font-size: 12px;
        text-align: right;
        opacity: 0.6;
      }

      .work-detail__title {
        margin: 3rem 0 1rem;
        font-family: "Noto Serif KR", serif;
        font-size: clamp(30px, 6vw, 50px);
        font-weight: 400;
        line-height: 1.4;
        letter-spacing: -0.05em;
      }

      /* ==============================
         작품 본문
      ============================== */

      .work-detail__content {
        margin-top: 2rem;
      }

      .work-detail__poem {
        font-family: "Noto Serif KR", serif;
        font-size: 17px;
        line-height: 2.4;
        letter-spacing: -0.02em;
        text-align: justify;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }

      .work-detail__poem p {
        margin-bottom: 1em;
      }

      /* ==============================
         작품 링크 및 이미지
      ============================== */

      #work-link {
        display: flex;
        justify-content: flex-end;
        margin-top: 3.5rem;
      }

      #work-link img {
        max-height: 230px;
        border: 1px solid #000;
      }

      /* ==============================
         뒤로가기
      ============================== */

      .work-detail__footer {
        display: inline-block;
        margin-top: 5rem;
        border: 0.5px solid #666;
        background: #fbf8f0;
        color: #455c43;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .work-detail__footer a {
        display: inline-block;
        padding: 0.5rem 1rem;
      }

      .work-detail__footer:hover {
        background-color: #739b733d;
        color: #739b73;
      }

      /* ==============================
         모바일
      ============================== */

      @media (max-width: 600px) {
        .work-detail {
          width: calc(100% - 40px);
        }

        .work-detail__poem {
          font-size: 16px;
          line-height: 2.2;
        }
      }

      /* ==============================
         모션 최소화 설정
      ============================== */

      @media (prefers-reduced-motion: reduce) {
        .work-detail__footer {
          transition: none;
        }
      }
    </style>
  </head>

  <body class="work-bg">
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TRR38Z77"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>

    <div id="shared-header"></div>

    <!-- ==============================
         MAIN
    ============================== -->

    <main class="work-detail">
      <!-- 작품 제목 및 정보 -->
      <div class="work-detail__header">
        <p class="work-detail__meta" id="work-meta"></p>

        <h2 class="work-detail__title" id="work-title"></h2>
      </div>

      <!-- 작품 본문 -->
      <div class="work-detail__content">
        <div class="work-detail__poem" id="work-content"></div>
      </div>

      <!-- 작품 관련 링크 -->
      <a id="work-link" target="_blank" rel="noopener noreferrer" href="#">
        <img id="work-img" class="bg_img" alt="작품 관련 이미지" />
      </a>

      <!-- 뒤로가기 -->
      <div class="work-detail__footer">
        <a href="javascript:history.back();">← 뒤로가기</a>
      </div>
    </main>

    <!-- ==============================
         FOOTER
    ============================== -->

    <footer class="footer">
      <div class="footer__inner">
        <p class="footer__name">eundoo.com</p>
        <p class="footer__copyright">© 2026 Lee Eun Joo</p>
      </div>
    </footer>

    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <!-- Supabase JS SDK 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // Supabase 연결 설정 (공개용 Publishable key 사용)
      const supabaseUrl = "https://jxyucxgpdlfidzwizski.supabase.co";
      const supabaseKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4eXVjeGdwZGxmaWR6d2l6c2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2NjAzMzUsImV4cCI6MjExMTIzNjMzNX0.cwgm-FWcZbdfSL-vuFvYQx2AS4W3x2GJ2GLWbcC5Ksk";
      const db = supabase.createClient(supabaseUrl, supabaseKey);

      // URL에서 작품 ID 가져오기 (예: ?id=02)
      const params = new URLSearchParams(window.location.search);
      const workId = params.get("id");

      // 작품 데이터 불러오기
      // 작품 데이터 불러오기
      async function initWorkDetail() {
        try {
          // 기본 쿼리: 공개된 작품 조회
          let query = db.from("works").select("*").eq("is_published", true);

          if (workId) {
            // URL에 ?id=02 가 있으면 해당 작품 조회
            query = query.eq("id", workId);
          } else {
            // URL에 ?id 가 없으면 가장 최신 작품(id 내림차순 1번째) 자동 선택
            // (특정 작품을 기본으로 띄우고 싶다면 .eq("id", "02") 로 바꾸면 됩니다)
            query = query.order("id", { ascending: false }).limit(1);
          }

          const { data: work, error } = await query.single();

          // 작품이 없거나 조회 에러 발생 시
          if (error || !work) {
            document.querySelector(".work-detail").innerHTML =
              "<p>작품을 찾을 수 없습니다.</p>";
            return;
          }

          // 브라우저 탭 제목 변경
          document.title = `읽어봐요 : ${work.title}`;

          // 작품 정보 표시
          document.querySelector("#work-meta").textContent =
            `${work.year ?? ""} · ${work.publication ?? ""}`;

          document.querySelector("#work-title").textContent = work.title ?? "";

          // DB의 content 컬럼(마크다운 원문)을 바로 HTML로 변환
          document.querySelector("#work-content").innerHTML = marked.parse(
            work.content ?? "",
          );

          // 작품 관련 링크
          const workLink = document.querySelector("#work-link");
          const workImage = document.querySelector("#work-img");

          if (!work.link || work.link === "undefined") {
            workLink.style.display = "none";
          } else {
            workLink.style.display = "flex";
            workLink.href = work.link;
          }

          // 작품 이미지
          if (work.img) {
            workImage.src = work.img;
            workImage.style.display = "block";
          } else {
            workImage.style.display = "none";
          }
        } catch (error) {
          console.error("작품을 불러오는 중 오류가 발생했습니다.", error);

          document.querySelector(".work-detail").innerHTML =
            "<p>작품을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>";
        }
      }

      // 페이지 실행
      initWorkDetail();
    </script>
    <script src="../assets/js/common.js"></script>
  </body>
</html>
