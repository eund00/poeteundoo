    <title>읽어봐요 : 은듀닷컴</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap");

      #work-title {
        font-family: "Noto Serif KR", serif;
      }
      #work-content {
        font-family: "Noto Serif KR", serif;
      }
      .work-detail {
        width: min(1100px, calc(100% - 80px));
        margin: 80px auto 0;
      }

      .work__header {
        padding-bottom: 70px;
        border-bottom: 1px solid #111;
      }

      .work__category {
        margin-bottom: 30px;

        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .work__title {
        font-family: "Noto Serif KR", Georgia, serif;
        font-size: clamp(50px, 7vw, 100px);
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -0.07em;
      }

      .work__meta {
        display: flex;
        gap: 25px;

        margin-top: 40px;

        font-size: 12px;
        opacity: 0.6;
      }

      .work__body {
        padding: 100px 0;
      }

      .work__text {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;

        font-family: "Noto Serif KR", serif;
        font-size: 17px;
        line-height: 2.4;
        letter-spacing: -0.02em;
      }

      .work__text p {
        margin-bottom: 1em;
      }

      .work__footer {
        padding-top: 40px;
        border-top: 1px solid #111;
      }

      .work__credits {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 30px;
      }

      .work__credits div {
        display: grid;
        grid-template-columns: 120px 1fr;
      }

      .work__credits dt {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.5;
      }

      .work__credits dd {
        margin: 0;
        font-size: 12px;
      }

      .work-detail {
        max-width: 550px;
      }
      .work-detail__poem {
        white-space: pre-line;
        text-align: justify;
        overflow-wrap: anywhere;
      }
      .work-detail__meta {
        text-align: right;
      }
      .work-detail__title {
        margin: 3rem 0 1rem;
      }
      .work-detail__content {
        margin-top: 2rem;
      }
      #work-link {
        margin-top: 3.5rem;
        display: flex;
        justify-content: end;
      }
      #work-link img {
        border: 1px solid #000;
        max-height: 230px;
      }
      .work-detail__footer {
        display: inline-block;
        margin-top: 5rem;
        background: #739b73;
        color: #fff;
        border-radius: 10px;
        font-size: 0.8rem;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }
      .work-detail__footer a {
        display: inline-block;
        padding: 0.5rem 1rem;
      }
      .work-detail__footer:hover {
        background: #739b733d;
        color: #739b73;
      }
    </style>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TRR38Z77"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header class="header">
      <div class="header__inner">
        <h1 class="logo">
          <a href="/">은듀닷컴</a>
        </h1>

        <!-- <nav class="gnb">
          <ul class="gnb__list">
            <li><a href="/works">Works</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/interview">Interview</a></li>
            <li><a href="/archive">Archive</a></li>
          </ul>
        </nav> -->
      </div>
    </header>

    <main class="work-detail">
      <div class="work-detail__header">
        <p class="work-detail__meta" id="work-meta"></p>

        <h2 class="work-detail__title" id="work-title"></h2>
      </div>

      <div class="work-detail__content">
        <div class="work-detail__poem" id="work-content"></div>
      </div>

      <a
        id="work-link"
        target="_blank"
        href="
      "
      >
        <img id="work-img" class="bg_img" />
      </a>

      <div class="work-detail__footer">
        <a href="javascript:history.back();">← 뒤로가기</a>
      </div>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <p class="footer__name">eundoo.com</p>
        <p class="footer__copyright">© 2026 Lee Eun Joo</p>
      </div>
    </footer>

    <script>
      const params = new URLSearchParams(window.location.search);
      const workId = params.get("id");

      fetch("../works/works.json")
        .then((response) => response.json())
        .then((works) => {
          const work = works.find((item) => item.id === workId);

          if (!work) {
            document.querySelector(".work-detail").innerHTML =
              "<p>작품을 찾을 수 없습니다.</p>";
            return;
          }

          document.title = `읽어봐요 : ${work.title}`;

          document.querySelector("#work-meta").textContent =
            `${work.year} · ${work.publication}`;

          document.querySelector("#work-title").textContent = work.title;

          // 마크다운 파일 불러오기
          return fetch(work.contentFile)
            .then((response) => {
              if (!response.ok) {
                throw new Error("마크다운 파일을 불러오지 못했습니다.");
              }
              return response.text();
            })
            .then((markdown) => {
              document.querySelector("#work-content").innerHTML =
                marked.parse(markdown);
            })
            .then(() => {
              const workLink = document.querySelector("#work-link");

              if (!work.link || work.link === "undefined") {
                workLink.style.display = "none";
              } else {
                workLink.style.display = "";
                workLink.setAttribute("href", work.link);
              }

              document.querySelector("#work-img").src = work.img;
            });
        })
        .catch((error) => {
          console.error("작품을 불러오는 중 오류가 발생했습니다.", error);
        });
    </script>
  </body>
</html>
