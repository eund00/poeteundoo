  <body>
    <div class="modal">
      <div class="modal-in">
        <span id="modal-icon" style="font-size: 2rem">💌</span>
        <p id="modal-text">이 곳은 내 다이어리야. 비밀을 지켜야 해.</p>
        <div>
          <button id="modal-yes">응, 알겠어.</button>
          <button id="modal-no">싫어, 내가 왜?</button>
        </div>
      </div>
    </div>
    <style>
      .modal {
        position: fixed;
        width: 100vw;
        height: 100vh;
        background-color: #739b73;
        z-index: 999;
      }
      .modal-in {
        max-width: 500px;
        width: 86%;

        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        z-index: 1000;
        padding: 24px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }
      .modal-in > div {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
      }
    </style>
    <script>
      const modal = document.querySelector(".modal");
      const yesBtn = document.querySelector("#modal-yes");
      const noBtn = document.querySelector("#modal-no");
      const modalIcon = document.querySelector("#modal-icon");
      const modalText = document.querySelector("#modal-text");

      yesBtn.addEventListener("click", () => {
        location.href = "diary.html";
      });

      noBtn.addEventListener("click", () => {
        modalIcon.textContent = "💔";
        modalText.innerHTML =
          '<span style="color: red; font-size: 20px">너무해!!</span>';

        yesBtn.style.display = "none";
        noBtn.style.display = "none";

        setTimeout(() => {
          location.href =
            "https://www.google.com/search?q=%EC%96%91%EC%8B%AC&sca_esv=9b409f63e8a1ac33&hl=ko&sxsrf=APpeQntzNC26xx-9Z34WQr8KIGNSwkiwOA%3A1792042301838&source=hp&ei=PWXQapzMMO3i2roP2PeumQ4&iflsig=ABILxe8AAAAAatBzTcoLRDuBxij2WR002SR1CeAI5Zc7&ved=0ahUKEwjc3sjmpbuXAxVtsVYBHdi7K-MQ4dUDCCg&uact=5&oq=%EC%96%91%EC%8B%AC&gs_lp=Egdnd3Mtd2l6IgbslpHsi6wyBRAAGIAEMgUQABiABDIFEAAYgAQyBRAAGIAEMgUQABiABDIFEAAYgAQyBRAAGIAEMgUQABiABDIFEAAYgAQyBRAAGIAESM8MUABYpwtwAHgAkAEAmAFhoAGsBKoBATa4AQPIAQD4AQGYAgOgAqYCwgILEC4YgAQYsQMYgwHCAgsQABiABBixAxiDAcICBBAAGAPCAggQLhiABBixA8ICBRAuGIAEmAMAkgcDMi4xoAe_N7IHAzIuMbgHpgLCBwUwLjIuMcgHBYAIAQ&sclient=gws-wiz";
        }, 1500);
      });
