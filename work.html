<!doctype html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LEE EUN JOO</title>

    <link rel="stylesheet" href="index.css" />

    <style>
      .work-detail {
        max-width: 500px;
      }
      .work-detail__poem {
        white-space: pre-line;
      }
      .work-detail__meta {
        text-align: right;

      .work-detail__title {
        margin: 3rem 0 1rem;

      .work-detail__footer {

            <li><a href="/interview">Interview</a></li>

      <div class="work-detail__footer">
