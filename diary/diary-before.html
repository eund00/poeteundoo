    <title>지킬거야? : 은듀닷컴</title>

  <body>
    <div class="modal">
      <div class="modal-in">
        <div class="modal-titlebar">
          <span class="modal-title"> 💌 알림 </span>
          <button
            type="button"
            class="modal-close"
            aria-label="닫기"
            id="modal-close"
          >
            ×
          </button>
        </div>

        <div class="modal-content">
          <span id="modal-icon" class="modal-icon">📒</span>
          <p id="modal-text">
            이 곳은 내 다이어리야.
            <br />
            비밀을 지켜야 해.
          </p>

          <div class="modal-buttons">
            <button id="modal-yes">응, 알겠어.</button>
            <button id="modal-no">싫어, 내가 왜?</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 떠다니는 유령 -->
    <div class="ghost-container" aria-hidden="true">
      <span class="ghost">👻</span>
      <span class="ghost">👻</span>
      <span class="ghost">👻</span>
      <span class="ghost">👻</span>
      <span class="ghost">👻</span>
      <span class="ghost">👻</span>
    </div>
    <style>
      /* ==============================
   떠다니는 유령
============================== */

      .ghost-container {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        pointer-events: none;
      }

      .ghost {
        position: absolute;
        display: block;

        font-size: 35px;
        opacity: 0.15;
        filter: blur(1px);

        animation: ghost-float 18s ease-in-out infinite alternate;
      }

      /* 각 유령의 위치와 움직임 */

      .ghost:nth-child(1) {
        top: 15%;
        left: 10%;
        animation-duration: 20s;
      }

      .ghost:nth-child(2) {
        top: 40%;
        left: 75%;
        font-size: 50px;
        animation-duration: 25s;
        animation-delay: -5s;
      }

      .ghost:nth-child(3) {
        top: 70%;
        left: 20%;
        font-size: 28px;
        animation-duration: 17s;
        animation-delay: -8s;
      }

      .ghost:nth-child(4) {
        top: 85%;
        left: 85%;
        font-size: 45px;
        animation-duration: 23s;
        animation-delay: -12s;
      }

      .ghost:nth-child(5) {
        top: 55%;
        left: 45%;
        font-size: 25px;
        animation-duration: 19s;
        animation-delay: -3s;
      }

      .ghost:nth-child(6) {
        top: 10%;
        left: 90%;
        font-size: 30px;
        animation-duration: 27s;
        animation-delay: -15s;
      }

      /* 둥실둥실 움직임 */

      @keyframes ghost-float {
        0% {
          transform: translate(0, 0) rotate(-15deg);
        }

        25% {
          transform: translate(40px, -50px) rotate(10deg);
        }

        50% {
          transform: translate(-30px, 30px) rotate(-10deg);
        }

        75% {
          transform: translate(60px, 20px) rotate(15deg);
        }

        100% {
          transform: translate(-20px, -60px) rotate(-5deg);
        }
      }

      /* 모션 최소화 설정 */

      @media (prefers-reduced-motion: reduce) {
        .ghost {
          animation: none;
        }
      }
    </style>

    <style>
      html::before {
        content: "";
        width: 100%;
        height: 100%;
        position: absolute;
        background-image: url(https://images.unsplash.com/photo-1702628909173-96b23bee3f49?q=80&w=1097&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);
        background-attachment: fixed;
        opacity: 0.1;
      }
      .modal {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: rgba(43, 51, 39, 0.48);
        z-index: 999;
        font-family: inherit;
      }

      .modal-in {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 86%;
        max-width: 420px;
        background: #f5f0e6;
        z-index: 1000;
      }

      /* 윈도우 스타일 제목 표시줄 */
      .modal-titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;

        min-height: 34px;
        padding: 8px 10px;

        background: #739b73;
        color: #fffdf5;
        font-size: 15px;
        letter-spacing: 0.02em;

        border: 1px solid #666;
      }

      .modal-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 우측 상단 닫기 버튼 */
      .modal-close {
        width: 25px;
        height: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #455c43;
        font-family: Arial, sans-serif;
        font-size: 25px;
      }

      .modal-close:hover {
        background: #e8e0d3;
        border: none;
      }

      .modal-close:active {
        box-shadow: inset 1px 1px 0 #9eaa94;
      }

      /* 팝업 내용 */
      .modal-content {
        padding: 28px 22px 24px;
        text-align: center;
        border: 1px solid #666;
        border-top: none;
      }

      .modal-icon {
        display: inline-block;
        font-size: 2rem;
        margin-bottom: 5px;
      }

      #modal-text {
        margin: 10px 0 0;
        color: #39362f;
        font-size: 15px;
        line-height: 1.8;
      }

      /* 버튼 영역 */
      .modal-buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .modal-buttons button {
        padding: 9px 15px;
        border: 0.5px solid #666;
        background: #fbf8f0;
        color: #455c43;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .modal-buttons button:hover {
        background: #e6eddf;
      }

      .modal-buttons button:active {
        transform: translate(1px, 1px);
        box-shadow: 1px 1px 0 #d5d9cb;
      }

      @media (max-width: 420px) {
        .modal-content {
          padding: 24px 16px 20px;
        }

        .modal-buttons {
          gap: 8px;
        }
      }
    </style>
    <script>
      document.getElementById("modal-close").addEventListener("click", () => {
        window.location.href = "../index.html";
      });

      const modal = document.querySelector(".modal");
      const yesBtn = document.querySelector("#modal-yes");
      const noBtn = document.querySelector("#modal-no");
      const modalIcon = document.querySelector("#modal-icon");
      const modalText = document.querySelector("#modal-text");

      yesBtn.addEventListener("click", () => {
        location.href = "diary.html";
      });

      noBtn.addEventListener("click", () => {
        modalIcon.textContent = "💔";
        modalText.innerHTML =
          '<span style="color: red; font-size: 20px">너무해!!</span>';

        yesBtn.style.display = "none";
        noBtn.style.display = "none";

        setTimeout(() => {

        }, 1500);
      });
    </script>
  </body>
