    <style>
      /* ========================================
   은듀닷컴 DIARY
   오래된 인터넷 일기장
======================================== */

      /* ========================================
   1. RESET & BASE
======================================== */

      * {
        box-sizing: border-box;
      }

      html {
        position: relative;
      }

      html::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-image: url("https://images.unsplash.com/photo-1740083652275-7422a4184e90?q=80&w=1228&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D");
        background-attachment: fixed;
        background-size: cover;
        background-position: center;
        opacity: 0.1;
        pointer-events: none;
      }

      body {
        margin: 0;
        color: #292929;
        background: #fff;
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        line-height: 1.7;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      /* ========================================
   2. PAGE LAYOUT
======================================== */

      .diary-page {
        position: relative;
        z-index: 99;
        max-width: 950px;
        min-height: 100vh;
        margin: 110px auto 40px;
        padding: 38px 30px 30px;
        background: rgba(255, 255, 250, 0.88);
        border: 1px solid #e8e6d9;
      }

      /* ========================================
   3. PAGE HEADING
======================================== */

      .diary-heading {
        position: relative;
        margin-bottom: 42px;
        padding: 24px 22px 22px;
        border: 1px solid #dce0d1;
        background: #f8f8ef;
        box-shadow: 3px 3px 0 #e8eadf;
      }

      .diary-heading h1 {
        margin: 0;
        color: #495744;
        font-family: Georgia, serif;
        font-size: clamp(40px, 7vw, 60px);
        font-weight: 400;
        letter-spacing: -0.06em;
      }

      .diary-heading::after {
        content: "✿  MY LITTLE DIARY  ✿";
        display: block;
        margin-top: 13px;
        color: #8b9b7d;
        font-family: Georgia, serif;
        font-size: 10px;
        letter-spacing: 0.18em;
      }

      .diary-intro {
        margin-top: 10px;
        color: #8b887b;
        font-size: 13px;
        word-break: keep-all;
      }

      /* ========================================
   4. SEARCH & COUNT
======================================== */

      .diary-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
        padding: 12px 4px 16px;
        border-bottom: 1px dashed #bdc9b0;
      }

      .diary-count {
        flex-shrink: 0;
        color: #829078;
        font-family: Georgia, serif;
        font-size: 13px;
        letter-spacing: 0.05em;
      }

      .diary-search {
        width: min(260px, 60%);
        padding: 10px;
        border: 1px solid #e2e4d9;
        border-radius: 2px;
        outline: none;
        background: #fbfbf6;
        color: #555b4f;
        font-size: 13px;
        transition: border-color 0.2s;
      }

      .diary-search:focus {
        border-color: #9cac8d;
      }

      /* ========================================
   5. CATEGORIES
======================================== */

      .diary-categories {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 20px 0;
      }

      .diary-category {
        padding: 5px 12px;
        border: 1px solid #dfe3d7;
        border-radius: 2px;
        background: #fbfbf6;
        color: #858779;
        font-size: 12px;
        transition: all 0.2s;
      }

      .diary-category:hover {
        border-color: #a6b59a;
        color: #53674d;
      }

      .diary-category.active {
        border-color: #7e9472;
        background: #7e9472;
        color: #fff;
      }

      /* ========================================
   6. DIARY LIST
======================================== */

      .diary-list {
        border-top: 1px solid #aebba3;
        background: rgba(255, 255, 250, 0.55);
      }

      .diary-item {
        position: relative;
        display: grid;
        grid-template-columns: 95px minmax(0, 1fr);
        align-items: center;
        gap: 18px;
        padding: 25px 12px;
        border-bottom: 1px dashed #d9ddcf;
        transition:
          background 0.2s,
          padding 0.2s;
      }

      .diary-item:hover {
        padding-left: 17px;
        background: #f3f5eb;
      }

      .diary-date {
        padding-top: 5px;
        color: #9b9b8b;
        font-family: Georgia, serif;
        font-size: 14px;
        white-space: nowrap;
      }

      .diary-line {
        display: flex;
        align-items: center;
      }

      .diary-item-category {
        color: #839576;
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .diary-item span.category {
        margin-right: 8px;
        opacity: 1;
      }

      .diary-item h2 {
        display: inline-block;
        margin: 0;
        color: #4a5045;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: -0.035em;
      }

      .diary-preview {
        display: -webkit-box;
        overflow: hidden;
        margin: 8px 0 0;
        color: #929084;
        font-size: 12px;
        line-height: 1.8;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        white-space: pre-line;
      }

      .diary-empty {
        padding: 70px 0;
        color: #999;
        text-align: center;
        font-size: 14px;
      }

      /* ========================================
   7. PAGINATION
======================================== */

      .diary-pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 30px;
      }

      .diary-page-button {
        min-width: 32px;
        height: 32px;
        padding: 0 8px;
        border: 1px solid #e5e6dc;
        border-radius: 2px;
        background: transparent;
        color: #888b7d;
        font-size: 13px;
      }

      .diary-page-button:hover:not(:disabled) {
        background: #f5f5f5;
        color: #292929;
      }

      .diary-page-button.active {
        border-color: #819576;
        background: #819576;
        color: #fff;
      }

      .diary-page-button:disabled {
        cursor: default;
        opacity: 0.3;
      }

      /* ========================================
   8. DIARY DETAIL
======================================== */

      .diary-detail {
        position: relative;
        border: 1px solid #d9d9c9;
        background: #fffef8;
        box-shadow: 4px 4px 0 #e9e9de;
      }

      .diary-detail-title {
        position: relative;
        isolation: isolate;
        padding: 28px 26px 20px;
        background-color: #f3f3e8;
      }

      .diary-detail-title::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image: url("https://images.unsplash.com/photo-1653723470659-3071c310b06f?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D");
        background-size: cover;
        background-position: center;
        opacity: 0.18;
      }

      .diary-detail-category {
        color: #819276;
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      .diary-detail h1 {
        margin: 12px 0 20px;
        color: #495744;
        font-size: clamp(26px, 5vw, 38px);
        font-weight: 400;
        line-height: 1.45;
      }

      .diary-detail-date {
        display: block;
        color: #999687;
        font-family: Georgia, serif;
        font-size: 12px;
        text-align: right;
      }

      /* 본문 */

      .diary-detail-content {
        padding: 30px 28px;
        border-top: 1px dashed #d6d8ca;
        background-color: #fffdf5;
        color: #4b4a42;
        font-family: "Chiron Hei HK", sans-serif;
        font-size: 15px;
        line-height: 2.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-align: justify;
      }

      .diary-detail-content p {
        margin: 0 0 1.5em;
      }

      .diary-detail-content img {
        max-width: 100%;
        width: 100%;
        height: auto;
        padding: 4px;
        border: 1px solid #e6e2d5;
        background: #fff;
      }

      /* ========================================
   9. DETAIL NAVIGATION
======================================== */

      .diary-detail-nav {
        position: absolute;
        bottom: -62px;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
      }

      .diary-nav-button,
      .diary-back {
        min-width: 42px;
        padding: 10px 12px;
        border: 1px solid #d5dccb;
        border-radius: 2px;
        background: #f7f8ef;
        color: #68785e;
        box-shadow: 2px 2px 0 #e7e9de;
        font: inherit;
        font-size: 13px;
        transition: all 0.2s;
      }

      .diary-nav-button:hover:not(:disabled),
      .diary-back:hover {
        border-color: #91a286;
        background: #e9eee2;
        color: #43563c;
      }

      .diary-nav-button:disabled {
        background: #f4f3ec;
        color: #c6c5ba;
        box-shadow: none;
        cursor: default;
        opacity: 0.5;
      }

      .diary-back {
        border-color: #819576;
        background: #819576;
        color: #fff;
      }

      /* ========================================
   10. FOOTER
======================================== */

      .diary-footer {
        margin-top: 95px;
        padding-top: 18px;
        border-top: 1px dashed #d5d9cb;
        color: #a4a391;
        font-family: Georgia, serif;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-align: center;
      }

      /* ========================================
   11. MOBILE
======================================== */

      @media (max-width: 600px) {
        .diary-page {
          margin: 0;
          padding: 28px 18px 25px;
          border: 0;
          margin-top: 70px;
        }

        .header__inner {
          padding: 0 20px;
        }

        .diary-heading {
          margin-bottom: 32px;
          padding: 20px 16px;
        }

        .diary-tools {
          gap: 12px;
        }

        .diary-search {
          width: 65%;
        }

        .diary-item {
          grid-template-columns: 1fr;
          gap: 7px;
          padding: 20px 8px;
        }

        .diary-item:hover {
          padding-left: 12px;
        }

        .diary-date {
          padding: 0;
        }

        .diary-line {
          flex-wrap: wrap;
          row-gap: 5px;
        }

        .diary-item h2 {
          font-size: 16px;
        }

        .diary-preview {
          flex-basis: 100%;
        }

        .diary-detail-title {
          padding: 23px 18px 18px;
        }

        .diary-detail-content {
          padding: 30px 35px;
          font-size: 16px;
        }

        .diary-detail-nav {
          bottom: -58px;
        }
      }
    </style>

    <script>
      "use strict";

      let diaryPosts = [];
      let activeCategory = "전체";
      let currentPage = 1;

      const postsPerPage = 5;

      const listView = document.getElementById("diary-list-view");
      const listEl = document.getElementById("diary-list");
      const countEl = document.getElementById("diary-count");
      const searchEl = document.getElementById("diary-search");
      const categoriesEl = document.getElementById("diary-categories");
      const paginationEl = document.getElementById("diary-pagination");
      const detailEl = document.getElementById("diary-detail");

      // 상세 글 요청 순서 관리 (빠른 게시글 이동 시 충돌 방지)
      let detailRequestCount = 0;

      /* ========================================
     날짜 포맷
  ======================================== */

      function formatDate(date) {
        if (!date) return "";

        const [year, month, day] = date.split("-");
        return `${year}.${month}.${day}`;
      }

      /* ========================================
     HTML 특수문자 이스케이프
  ======================================== */

      function escapeHTML(value = "") {
        return String(value).replace(/[&<>"']/g, (char) => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[char];
        });
      }

      /* ========================================
     게시글 식별자
     contentFile을 고유 식별자로 사용
  ======================================== */

      function getPostByFile(file) {
        return diaryPosts.find((post) => post.contentFile === file);
      }

      /* ========================================
     최신 날짜순 정렬
  ======================================== */

      /* ========================================
   최신 날짜순 + 같은 날짜는 파일 번호순 정렬
======================================== */

      function getSortedPosts() {
        return [...diaryPosts].sort((a, b) => {
          // 1. 날짜가 다르면 최신 날짜 우선
          const dateCompare = String(b.date).localeCompare(String(a.date));

          if (dateCompare !== 0) {
            return dateCompare;
          }

          // 2. 날짜가 같으면 파일명 뒤의 숫자가 큰 글 우선
          const getFileNumber = (file) => {
            const match = file.match(/_(\d+)\.md$/);
            return match ? Number(match[1]) : 1;
          };

          return getFileNumber(b.contentFile) - getFileNumber(a.contentFile);
        });
      }

      /* ========================================
     카테고리 출력
  ======================================== */

      function renderCategories() {
        const categories = [
          "전체",
          ...new Set(diaryPosts.map((post) => post.category)),
        ];

        categoriesEl.innerHTML = categories
          .map(
            (category) => `
          <button
            type="button"
            class="diary-category ${
              activeCategory === category ? "active" : ""
            }"
            data-category="${escapeHTML(category)}"
            aria-pressed="${activeCategory === category}"
          >${escapeHTML(category)}</button>
        `,
          )
          .join("");
      }

      /* ========================================
     게시글 목록 + 검색 + 페이지네이션
  ======================================== */

      function renderList() {
        const keyword = searchEl.value.trim().toLowerCase();

        // 검색어와 카테고리 필터 적용
        const filteredPosts = getSortedPosts().filter((post) => {
          const matchesCategory =
            activeCategory === "전체" || post.category === activeCategory;

          const text = [post.title, post.preview, post.content, post.category]
            .join(" ")
            .toLowerCase();

          return matchesCategory && text.includes(keyword);
        });

        const totalPages = Math.ceil(filteredPosts.length / postsPerPage);

        // 페이지 범위 보정
        if (totalPages === 0) {
          currentPage = 1;
        } else if (currentPage > totalPages) {
          currentPage = totalPages;
        }

        const startIndex = (currentPage - 1) * postsPerPage;

        const posts = filteredPosts.slice(
          startIndex,
          startIndex + postsPerPage,
        );

        countEl.textContent = `TOTAL ${filteredPosts.length}`;

        // 게시글 출력
        listEl.innerHTML = posts.length
          ? posts
              .map(
                (post) => `
              <a
                class="diary-item"
                href="?file=${encodeURIComponent(post.contentFile)}"
                data-post-file="${escapeHTML(post.contentFile)}"
              >
                <time
                  class="diary-date"
                  datetime="${escapeHTML(post.date)}"
                >${formatDate(post.date)}</time>

                <div class="diary-line">
                  <div class="diary-item-category">
                    <span class="category">
                      [ ${escapeHTML(post.category)} ]
                    </span>
                  </div>

                  <h2>${escapeHTML(post.title)}</h2>

                  <p class="diary-preview">${escapeHTML(post.preview)}</p>
                </div>
              </a>
            `,
              )
              .join("")
          : `<p class="diary-empty">아직 기록이 없어요.</p>`;

        // 페이지 번호 출력
        if (totalPages <= 1) {
          paginationEl.innerHTML = "";
          return;
        }

        let paginationHTML = `
      <button
        type="button"
        class="diary-page-button"
        data-page="${currentPage - 1}"
        aria-label="이전 페이지"
        ${currentPage === 1 ? "disabled" : ""}
      >‹</button>
    `;

        // 페이지 번호는 최대 5개까지만 표시
        const maxVisiblePages = 5;

        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        // 마지막 페이지에 가까우면 앞쪽 페이지를 채움
        startPage = Math.max(1, endPage - maxVisiblePages + 1);

        for (let page = startPage; page <= endPage; page++) {
          paginationHTML += `
        <button
          type="button"
          class="diary-page-button ${page === currentPage ? "active" : ""}"
          data-page="${page}"
          ${page === currentPage ? 'aria-current="page"' : ""}
        >${page}</button>
      `;
        }

        paginationHTML += `
      <button
        type="button"
        class="diary-page-button"
        data-page="${currentPage + 1}"
        aria-label="다음 페이지"
        ${currentPage === totalPages ? "disabled" : ""}
      >›</button>
    `;

        paginationEl.innerHTML = paginationHTML;
      }

      /* ========================================
     상세 게시글 출력
  ======================================== */

      async function renderDetail(file) {
        const post = getPostByFile(file);

        // 새로운 상세 글 요청 번호
        const requestId = ++detailRequestCount;

        // 브라우저 탭 제목 변경
        document.title = post
          ? `${post.title} : 은듀닷컴`
          : "다이어리 : 은듀닷컴";

        listView.hidden = true;
        detailEl.hidden = false;

        window.scrollTo(0, 0);

        // 게시글이 없는 경우
        if (!post) {
          detailEl.innerHTML = `
        <p class="diary-empty">게시글을 찾을 수 없습니다.</p>

        <button
          type="button"
          class="diary-back"
          id="diary-back"
        >← 목록으로</button>
      `;

          return;
        }

        // 상세 페이지 HTML
        detailEl.innerHTML = `
      <div class="diary-detail-title">
        <div class="diary-detail-category">
          ${escapeHTML(post.category)}
        </div>

        <h1>${escapeHTML(post.title)}</h1>

        <time
          class="diary-detail-date"
          datetime="${escapeHTML(post.date)}"
        >${formatDate(post.date)}</time>
      </div>

      <div class="diary-detail-content" id="diary-content">
        불러오는 중...
      </div>

      <div class="diary-detail-nav">
        <button
          type="button"
          class="diary-nav-button"
          data-detail-nav="prev"
          aria-label="이전 게시글"
        >←</button>

        <button
          type="button"
          class="diary-back"
          id="diary-back"
        >☰</button>

        <button
          type="button"
          class="diary-nav-button"
          data-detail-nav="next"
          aria-label="다음 게시글"
        >→</button>
      </div>
    `;

        // 게시글 이동 버튼 상태 설정
        const sortedPosts = getSortedPosts();

        const currentIndex = sortedPosts.findIndex(
          (item) => item.contentFile === file,
        );

        const prevButton = detailEl.querySelector('[data-detail-nav="prev"]');

        const nextButton = detailEl.querySelector('[data-detail-nav="next"]');

        // 최신 날짜순 기준: 이전 글은 더 오래된 글
        if (prevButton) {
          prevButton.disabled =
            currentIndex === -1 || currentIndex >= sortedPosts.length - 1;
        }

        if (nextButton) {
          nextButton.disabled = currentIndex <= 0;
        }

        // 본문 파일 불러오기
        try {
          const response = await fetch(`./${post.contentFile}`);

          if (!response.ok) {
            throw new Error("본문을 불러오지 못했습니다.");
          }

          const content = await response.text();

          // 다른 게시글로 이동했다면 이전 요청 무시
          if (requestId !== detailRequestCount) return;

          const contentEl = detailEl.querySelector("#diary-content");

          if (contentEl) {
            contentEl.innerHTML = content;
          }
        } catch (error) {
          if (requestId !== detailRequestCount) return;

          const contentEl = detailEl.querySelector("#diary-content");

          if (contentEl) {
            contentEl.textContent = "본문을 불러오지 못했습니다.";
          }

          console.error(error);
        }
      }

      /* ========================================
     목록으로 돌아가기
  ======================================== */

      function showList(updateHistory = true) {
        // 진행 중인 상세 글 요청 무효화
        detailRequestCount++;

        detailEl.hidden = true;
        listView.hidden = false;

        // 브라우저 탭 제목 복구
        document.title = "다이어리 : 은듀닷컴";

        if (updateHistory) {
          history.pushState({}, "", location.pathname);
        }

        window.scrollTo(0, 0);
      }

      /* ========================================
     카테고리 클릭
  ======================================== */

      categoriesEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");

        if (!button) return;

        activeCategory = button.dataset.category;
        currentPage = 1;

        renderCategories();
        renderList();
      });

      /* ========================================
     검색
  ======================================== */

      searchEl.addEventListener("input", () => {
        currentPage = 1;
        renderList();
      });

      /* ========================================
   페이지 번호 클릭
======================================== */

      paginationEl.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-page]");

        if (!button || button.disabled) return;

        console.log("페이지 버튼 클릭:", button.dataset.page);

        currentPage = Number(button.dataset.page);

        renderList();
      });

      /* ========================================
     게시글 클릭
  ======================================== */

      listEl.addEventListener("click", (event) => {
        const link = event.target.closest("[data-post-file]");

        if (!link) return;

        event.preventDefault();

        const file = link.dataset.postFile;

        history.pushState(
          { diaryDetail: true },
          "",
          `?file=${encodeURIComponent(file)}`,
        );

        renderDetail(file);
      });

      /* ========================================
     상세 글에서 목록으로 / 이전·다음 이동
  ======================================== */

      detailEl.addEventListener("click", (event) => {
        // 목록으로
        if (event.target.closest("#diary-back")) {
          showList();
          return;
        }

        // 이전 / 다음 게시글 이동
        const navButton = event.target.closest("[data-detail-nav]");

        if (!navButton || navButton.disabled) return;

        const currentFile = new URLSearchParams(location.search).get("file");

        const sortedPosts = getSortedPosts();

        const currentIndex = sortedPosts.findIndex(
          (post) => post.contentFile === currentFile,
        );

        if (currentIndex === -1) return;

        const direction = navButton.dataset.detailNav;

        // 최신 날짜순 배열에서 이전 글은 아래쪽, 다음 글은 위쪽
        const targetIndex =
          direction === "prev" ? currentIndex + 1 : currentIndex - 1;

        const targetPost = sortedPosts[targetIndex];

        if (!targetPost) return;

        const targetFile = targetPost.contentFile;

        history.pushState(
          { diaryDetail: true },
          "",
          `?file=${encodeURIComponent(targetFile)}`,
        );

        renderDetail(targetFile);
      });

      /* ========================================
     브라우저 뒤로 가기 / 앞으로 가기
  ======================================== */

      window.addEventListener("popstate", () => {
        const file = new URLSearchParams(location.search).get("file");

        if (file) {
          renderDetail(file);
        } else {
          showList(false);
        }
      });

      /* ========================================
     초기 데이터 로딩
  ======================================== */

      async function init() {
        try {
          const response = await fetch("./diary.json");

          if (!response.ok) {
            throw new Error("diary.json을 불러오지 못했습니다.");
          }

          diaryPosts = await response.json();

          // 필수 데이터 검증
          const usedFiles = new Set();

          for (const post of diaryPosts) {
            if (!post.contentFile || !post.date || !post.title) {
              throw new Error("게시글에 필수 데이터가 누락되었습니다.");
            }

            if (usedFiles.has(post.contentFile)) {
              throw new Error(`중복된 contentFile: ${post.contentFile}`);
            }

            usedFiles.add(post.contentFile);
          }

          renderCategories();
          renderList();

          // URL에 파일명이 있으면 상세 글 표시
          const file = new URLSearchParams(location.search).get("file");

          if (file) {
            renderDetail(file);
          }
        } catch (error) {
          console.error(error);

          countEl.textContent = "TOTAL 0";

          listEl.innerHTML = `
        <p class="diary-empty">
          기록을 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.
        </p>
      `;

          paginationEl.innerHTML = "";
        }
      }

      init();
    </script>
    <script src="../common.js"></script>
  </body>
</html>
