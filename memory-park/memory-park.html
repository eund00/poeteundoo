    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

  <body>
    <!-- 로딩 화면 -->
    <div
      class="memory-loading"
      id="memory-loading"
      aria-live="polite"
      aria-label="물건 기억을 불러오는 중"
    >
      <div class="memory-loading__box">
        <img
          src="https://i.pinimg.com/originals/7b/83/7d/7b837d4c0afbba735dd6373a7772645f.gif"
          alt="물건 기억을 불러오는 중"
          class="memory-loading__image"
        />
        <p>물건들의 기억을 불러오는 중...🧺</p>
      </div>
    </div>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TRR38Z77"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>

    <!-- ==============================
         HEADER
    ============================== -->

    <header class="header">
      <div class="header__inner">
        <h1 class="logo">
          <a href="/">은듀닷컴</a>
        </h1>

        <!-- PC 메뉴 -->
        <nav class="gnb">
          <ul class="gnb__list">
            <li class="gnb__item">
              <a href="/works/work.html">Works</a>
            </li>

            <li class="gnb__item">
              <a href="/diary/diary-before.html">Diary</a>
            </li>

            <li class="gnb__item">
              <a href="/guestbook/guestbook.html">Guestbook</a>
            </li>
          </ul>
        </nav>

        <!-- 태블릿 / 모바일 햄버거 메뉴 -->
        <button
          class="menu-toggle"
          id="menu-toggle"
          type="button"
          aria-label="메뉴 열기"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <!-- MEMORY PARK -->
    <section id="memory-park" class="memory-park">
      <div class="memory-park__header">
        <p class="memory-park__label">🧺 물건 기억소</p>

        <div class="memory-park__des-box">
          <p class="memory-park__des">
            물건을 소유하는 방식을 고민했어요.<br />
            제 방의 크기는 정해져 있지만, 살아갈수록<br />
            기억을 담은 물건들은 끊임없이 늘어나겠죠….<br />
            그런 이유로 오래된 물건들을 이곳으로 옮기고 있어요.<br />
          </p>
        </div>
      </div>

      <div class="memory-park__count">
        <span id="memory-count">0</span>개의 기억💡
      </div>
      <div
        id="memory-list"
        class="memory-park__list memory-park__grid"
        aria-live="polite"
      >
        <!-- JS로 물건 카드 생성 -->
      </div>

      <!-- 물건 상세 모달 -->
      <div class="memory-modal" id="memory-modal" aria-hidden="true">
        <div class="memory-modal__backdrop" data-modal-close></div>

        <div
          class="memory-modal__content"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-title"
        >
          <button
            class="memory-modal__close"
            data-modal-close
            aria-label="모달 닫기"
          >
            ❌
          </button>
          <div class="memory-modal__image">
            <img id="modal-image" src="" alt="" />
          </div>

          <div class="memory-modal__info">
            <span id="modal-date"></span>
            <div class="modal_wrap">
              <small id="modal-item"></small>
              <h2 id="modal-title"></h2>
            </div>
            <p id="modal-description"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- 물건 기억소 JS -->
    <script src="./memory-park.js"></script>

    <footer class="footer">
      <div class="footer__inner">
        <p class="footer__name">LEE EUN JOO</p>
        <p class="footer__copyright">© 2026 Lee Eun Joo</p>
      </div>
    </footer>
  </body>
