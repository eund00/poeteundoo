      }

      h1 {
        margin: 12px 0;
        font-size: clamp(28px, 5vw, 40px);
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: -0.04em;
        word-break: keep-all;
      }

      .content {
        margin-top: 45px;
        padding-top: 35px;
        border-top: 1px solid #eee;
        font-size: 15px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

          padding-top: 40px;

    <!-- Google Tag Manager (noscript) -->

        <!-- <nav class="gnb">

    </header>
    <main class="diary-detail">
      <div id="category" class="category"></div>
      <h1 id="title">불러오는 중...</h1>
      <time id="date" class="date"></time>
      <div id="content" class="content"></div>

      <a class="back" href="diary.html">← Diary</a>
    </main>

    <script>
      const escapeHTML = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );

      async function init() {
        const id = new URLSearchParams(location.search).get("id");

        if (!id) {
          document.getElementById("title").textContent =
            "게시글을 찾을 수 없습니다.";
          return;
        }

        try {
          const response = await fetch("./diary.json");

          if (!response.ok) throw new Error("목록 로드 실패");

          const posts = await response.json();
          const post = posts.find((item) => item.id === id);

          if (!post) throw new Error("게시글 없음");

          document.title = `${post.title} | 은듀닷컴`;

          document.getElementById("category").textContent = post.category;

          document.getElementById("title").textContent = post.title;

          document.getElementById("date").textContent = post.date.replaceAll(
            "-",
            ".",
          );

          const contentResponse = await fetch(`./${post.contentFile}`);

          if (!contentResponse.ok) {
            throw new Error("본문 로드 실패");
          }

          const content = await contentResponse.text();

          document.getElementById("content").innerHTML = content;
        } catch (error) {
          console.error(error);
          document.getElementById("title").textContent =
            "게시글을 불러오지 못했습니다.";
          document.getElementById("content").textContent =
            "주소를 확인하거나 목록으로 돌아가 주세요.";
        }
      }

      init();
    </script>
  </body>
