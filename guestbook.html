    <!-- 은듀닷컴 방명록: index.html의 </main> 바로 위에 삽입 -->
    <section class="guestbook" id="guestbook">
      <div class="guestbook__header">
        <p class="guestbook__eyebrow">GUESTBOOK</p>
        <h2 class="guestbook__title">방명록</h2>
        <p class="guestbook__intro">선플 부탁드려요.</p>
      </div>

      <form class="guestbook__form" id="guestbook-form">
        <input type="hidden" id="guestbook-parent-id" value="" />
        <div class="guestbook__fields">
          <label
            >닉네임
            <input
              id="guestbook-nickname"
              maxlength="24"
              required
              autocomplete="nickname"
              placeholder="누구세요?"
            />
          </label>
          <label
            >비밀번호
            <input
              id="guestbook-password"
              type="password"
              minlength="4"
              maxlength="100"
              required
              autocomplete="new-password"
              placeholder="분실 시 저에게 연락주세요!"
            />
          </label>
        </div>
        <label class="guestbook__message-label" for="guestbook-content"
          >남길 말</label
        >
        <textarea
          id="guestbook-content"
          maxlength="1000"
          rows="4"
          required
          placeholder="불특정 다수가 볼 수 있는 공간이에요. 안다무하게 부탁해요~.✏️"
        ></textarea>
        <label class="guestbook__private">
          <input id="guestbook-private" type="checkbox" />
          <span>비밀 댓글로 남기기</span>
        </label>
        <div class="guestbook__form-bottom">
          <p class="guestbook__hint">
            비밀번호는 저장된 댓글을 수정하거나 삭제할 때 필요해요.
          </p>
          <button type="submit" class="guestbook__submit" id="guestbook-submit">
            댓글 남기기
          </button>
        </div>
        <button
          type="button"
          class="guestbook__cancel"
          id="guestbook-cancel"
          hidden
        >
          답글 작성 취소
        </button>
        <p
          class="guestbook__status"
          id="guestbook-status"
          role="status"
          aria-live="polite"
        ></p>
      </form>

      <div class="guestbook__list-header">
        <h3>댓글목록</h3>
        <span id="guestbook-count">불러오는 중…</span>
      </div>
      <div class="guestbook__list" id="guestbook-list" aria-live="polite">
        <p class="guestbook__loading">방명록을 불러오는 중입니다.</p>
      </div>
    </section>

    <!-- Apps Script 웹 앱 URL을 guestbook.js의 API_URL에 설정하세요. -->
    <script src="/js/guestbook.js" defer></script>

    <!-- 은듀닷컴 커스텀 모달 -->
    <div id="guestbook-modal" class="gb-modal" hidden>
      <section
        class="gb-modal__box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="gb-modal-title"
      >
        <button
          type="button"
          class="gb-modal__close"
          id="gb-modal-close"
          aria-label="닫기"
        >
          ×
        </button>

        <!-- <p class="gb-modal__eyebrow">EUNDOO GUESTBOOK</p> -->
        <h2 id="gb-modal-title">알림</h2>
        <div id="gb-modal-message" class="gb-modal__message"></div>

        <form id="gb-modal-form">
          <input
            id="gb-modal-input"
            class="gb-modal__input"
            type="text"
            autocomplete="off"
            hidden
          />
          <textarea
            id="gb-modal-textarea"
            class="gb-modal__input gb-modal__textarea"
            rows="5"
            hidden
          ></textarea>

          <div id="gb-modal-error" class="gb-modal__error" hidden></div>

          <div class="gb-modal__actions" id="gb-modal-actions">
            <button
              type="button"
              class="gb-modal__button gb-modal__button--sub"
              id="gb-modal-cancel"
            >
              취소
            </button>
            <button
              type="submit"
              class="gb-modal__button gb-modal__button--main"
              id="gb-modal-submit"
            >
              확인
            </button>
          </div>
        </form>
      </section>
    </div>
    <style>
      /* 은듀닷컴 커스텀 모달 */
      .gb-modal[hidden],
      .gb-modal [hidden] {
        display: none !important;
      }

      .gb-modal {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgb(25 30 25 / 45%);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }

      .gb-modal__box {
        position: relative;
        padding: 1rem 1.5rem;
        border: 1px solid #ddd;
        background-color: #fff;
        animation: gb-modal-appear 0.2s ease-out;
        max-width: 350px;
        width: calc(100vw - 20px);
      }

      .gb-modal__close {
        position: absolute;
        top: 13px;
        right: 16px;
        border: 0;
        background: transparent;
        color: #777;
        font-size: 27px;
        cursor: pointer;
      }

      .gb-modal__eyebrow {
        margin: 0 0 12px;
        color: #739b73;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .gb-modal__box h2 {
        margin: 0 0 16px;
        color: #30372f;
        font-size: 1rem;
        font-weight: 650;
      }

      .gb-modal__message {
        margin-bottom: 20px;
        color: #62675f;
        font-size: 14px;
        line-height: 1.8;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .gb-modal__input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 7px;
        padding: 12px 13px;
        border: 1px solid #ddd;
        border-radius: 3px;
        background: #fff;
        color: #222;
        font: inherit;
        font-size: 14px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .gb-modal__input:focus {
        border-color: #739b73;
        box-shadow: 0 0 0 3px rgb(115 155 115 / 13%);
      }

      .gb-modal__textarea {
        resize: vertical;
        min-height: 120px;
        line-height: 1.7;
      }

      .gb-modal__error {
        margin: 0 0 12px;
        color: #c04e4e;
        font-size: 12px;
        line-height: 1.6;
      }

      .gb-modal__actions {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }

      .gb-modal__button {
        min-height: 42px;
        padding: 10px 18px;
        border: 0;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }

      .gb-modal__button:hover {
        opacity: 0.85;
      }

      .gb-modal__button:active {
        transform: scale(0.98);
      }

      .gb-modal__button--main {
        background: #739b73;
        color: white;
      }

      .gb-modal__button--sub {
        background: #f0f1ec;
        color: #555b52;
      }

      @keyframes gb-modal-appear {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 480px) {
        .gb-modal__button {
          flex: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .gb-modal__box {
          animation: none;
        }
      }
    </style>
