<html lang="ko">

        j.async = true;

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>다이어리 : 은듀닷컴</title>
    <link rel="icon" type="image/png" href="./img/favicon.png" />
    <link rel="stylesheet" href="index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dongle&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:ital,wght@0,200..900;1,200..900&family=Orbit&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #292929;
        background: #fff;
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        line-height: 1.7;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      /* 페이지 레이아웃 */
      .diary-page {
        max-width: 950px;
        margin: 0 auto;
        padding: 30px 0;
      }

      @media (max-width: 1400px) {
        .diary-page {
          margin: 0 40px;
        }
      }

      /* 페이지 제목 */
      .diary-heading {
        margin-bottom: 55px;
      }

      .diary-heading h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(42px, 7vw, 64px);
        font-weight: 400;
        letter-spacing: -0.04em;
      }

      .diary-intro {
        margin-top: 18px;
        color: #777;
        font-size: 14px;
        word-break: keep-all;
      }

      /* 검색 */
      .diary-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
        padding-bottom: 18px;
        border-bottom: 1px dashed #739b73;
      }

      .diary-count {
        flex-shrink: 0;
        color: #888;
        font-size: 13px;
      }

      .diary-search {
        width: min(260px, 60%);
        padding: 10px;
        border: 1px solid transparent;
        border-radius: 3px;
        outline: none;
        background: #cccccc20;
        font-size: 13px;
      }

      .diary-search:focus {
        border-color: #333;
      }

      /* 카테고리 */
      .diary-categories {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }

      .diary-category {
        padding: 5px 13px;
        border: 1px solid #e5e5e5;
        border-radius: 30px;
        background: #fff;
        color: #777;
        font-size: 12px;
      }

      .diary-category.active {
        border-color: #292929;
        background: #292929;
        color: #fff;
      }

      /* 게시글 목록 */
      .diary-list {
        border-top: 1px solid #292929;
      }

      .diary-item {
        display: grid;
        grid-template-columns: 100px minmax(0, 1fr);
        align-items: center;
        gap: 22px;
        padding: 27px 4px;
        border-bottom: 1px solid #eaeaea;
        transition: background 0.2s;
      }

      .diary-item:hover {
        background: #fafafa;
      }

      .diary-date {
        padding-top: 5px;
        color: #999;
        font-size: 12px;
        white-space: nowrap;
      }
      .diary-line {
        display: flex;
        align-items: center;
      }

      .diary-item-category {
        color: #999;
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .diary-item span.category {
        margin-right: 1vw;
        opacity: 0.8;
      }

      .diary-item h2 {
        display: inline-block;
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.035em;
      }

      .diary-preview {
        display: -webkit-box;
        overflow: hidden;
        margin: 8px 0 0;
        color: #777;
        font-size: 13px;
        line-height: 1.8;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        white-space: pre-line;
      }

      .diary-empty {
        padding: 70px 0;
        color: #999;
        text-align: center;
        font-size: 14px;
      }

      /* 페이지네이션 */
      .diary-pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 35px;
      }

      .diary-page-button {
        min-width: 34px;
        height: 34px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 3px;
        background: transparent;
        color: #888;
        font-size: 13px;
      }

      .diary-page-button:hover:not(:disabled) {
        background: #f5f5f5;
        color: #292929;
      }

      .diary-page-button.active {
        border-color: #292929;
        background: #292929;
        color: #fff;
      }

      .diary-page-button:disabled {
        cursor: default;
        opacity: 0.3;
      }

      /* 상세 글 */
      .diary-detail {
        padding: 15px 0;
      }

      .diary-detail-category {
        color: #999;
        font-size: 12px;
      }

      .diary-detail h1 {
        font-family: "Chiron Hei HK", sans-serif;
        margin: 12px 0;
        font-size: clamp(26px, 5vw, 38px);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1.4;
        word-break: keep-all;
      }

      .diary-detail-date {
        color: #999;
        font-size: 12px;
      }

      .diary-detail-content {
        font-family: "Chiron Hei HK", sans-serif;

        margin-top: 48px;
        padding-top: 35px;
        border-top: 1px solid #eaeaea;
        font-size: 15px;
        line-height: 2.1;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .diary-detail-content p {
        margin: 0 0 1.5em;
      }

      .diary-back {
        margin-top: 5rem;
        padding: 0;
        border: 0;
        background: none;
        color: #999;
        font-size: 0.8rem;
      }

      /* 푸터 */
      .diary-footer {
        margin-top: 75px;
        padding-top: 18px;
        border-top: 1px solid #eaeaea;
        color: #aaa;
        font-size: 11px;
        text-align: center;
      }

      /* 모바일 */
      @media (max-width: 600px) {
        .diary-page {
          margin: 0 20px;
          padding-top: 45px;
        }

        .diary-heading {
          margin-bottom: 38px;
        }

        .diary-item {
          grid-template-columns: 1fr;
          gap: 6px;
          padding: 22px 2px;
        }

        .diary-date {
          padding: 0;
        }

        .diary-item h2 {
          font-size: 17px;
        }

        .diary-detail-content {
          margin-top: 35px;
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TRR38Z77"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <header class="header">
      <div class="header__inner">
        <h1 class="logo">
          <a href="/">은듀닷컴</a>
        </h1>
      </div>
    </header>

    <main class="diary-page">
      <header class="diary-heading">
        <h1><span class="element">💗</span> Diary</h1>
        <p class="diary-intro">사부작사부작 . . . 뭔가 적긴하는 중</p>
      </header>

      <style>
        .element {
          animation: opacityBlink 1.5s ease-in-out infinite alternate;
        }

        @keyframes opacityBlink {
          from {
            opacity: 0.7;
          }
          to {
            opacity: 1;
          }
        }
      </style>

      <section id="diary-list-view">
        <div class="diary-tools">
          <span class="diary-count" id="diary-count"></span>
          <input
            class="diary-search"
            id="diary-search"
            type="search"
            placeholder="제목으로 검색해요"
            aria-label="제목으로 검색해요"
          />
        </div>

        <nav
          class="diary-categories"
          id="diary-categories"
          aria-label="카테고리 필터"
        ></nav>

        <div class="diary-list" id="diary-list"></div>

        <nav
          class="diary-pagination"
          id="diary-pagination"
          aria-label="게시글 페이지"
        ></nav>
      </section>

      <article class="diary-detail" id="diary-detail" hidden></article>

      <footer class="diary-footer">© 2026 Lee Eun Joo</footer>
    </main>

    <script>
      let diaryPosts = [];
      let activeCategory = "전체";
      let currentPage = 1;

      const postsPerPage = 5;

      const listView = document.getElementById("diary-list-view");
      const listEl = document.getElementById("diary-list");
      const countEl = document.getElementById("diary-count");
      const searchEl = document.getElementById("diary-search");
      const categoriesEl = document.getElementById("diary-categories");
      const paginationEl = document.getElementById("diary-pagination");
      const detailEl = document.getElementById("diary-detail");

      /* 날짜 포맷 */
      function formatDate(date) {
        if (!date) return "";

        const [year, month, day] = date.split("-");
        return `${year}.${month}.${day}`;
      }

      /* HTML 특수문자 이스케이프 */
      function escapeHTML(value = "") {
        return String(value).replace(/[&<>"']/g, (char) => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[char];
        });
      }

      /* 최신 날짜순 정렬 */
      function getSortedPosts() {
        return [...diaryPosts].sort((a, b) =>
          String(b.date).localeCompare(String(a.date)),
        );
      }

      /* 카테고리 출력 */
      function renderCategories() {
        const categories = [
          "전체",
          ...new Set(diaryPosts.map((post) => post.category)),
        ];

        categoriesEl.innerHTML = categories
          .map(
            (category) => `
              <button
                type="button"
                class="diary-category ${
                  activeCategory === category ? "active" : ""
                }"
                data-category="${escapeHTML(category)}"
                aria-pressed="${activeCategory === category}"
              >${escapeHTML(category)}</button>
            `,
          )
          .join("");
      }

      /* 검색 및 게시글 목록 + 페이지네이션 */
      function renderList() {
        const keyword = searchEl.value.trim().toLowerCase();

        // 검색어와 카테고리 필터 적용
        const filteredPosts = getSortedPosts().filter((post) => {
          const matchesCategory =
            activeCategory === "전체" || post.category === activeCategory;

          const text = [post.title, post.preview, post.content, post.category]
            .join(" ")
            .toLowerCase();

          return matchesCategory && text.includes(keyword);
        });

        const totalPages = Math.ceil(filteredPosts.length / postsPerPage);

        // 결과가 없거나 현재 페이지가 범위를 벗어난 경우 보정
        if (totalPages === 0) {
          currentPage = 1;
        } else if (currentPage > totalPages) {
          currentPage = totalPages;
        }

        const startIndex = (currentPage - 1) * postsPerPage;

        const posts = filteredPosts.slice(
          startIndex,
          startIndex + postsPerPage,
        );

        countEl.textContent = `TOTAL ${filteredPosts.length}`;

        // 게시글 출력
        listEl.innerHTML = posts.length
          ? posts
              .map(
                (post) => `
                  <a
                    class="diary-item"
                    href="?id=${encodeURIComponent(post.id)}"
                    data-post-id="${escapeHTML(post.id)}"
                  >
                    <time
                      class="diary-date"
                      datetime="${escapeHTML(post.date)}"
                    >${formatDate(post.date)}</time>

                    <div class="diary-line">
                      <div class="diary-item-category">
                        <span class="category">
                          [ ${escapeHTML(post.category)} ]
                        </span>
                      </div>

                      <h2>${escapeHTML(post.title)}</h2>

                      <p class="diary-preview">${escapeHTML(post.preview)}</p>
                    </div>
                  </a>
                `,
              )
              .join("")
          : `<p class="diary-empty">아직 기록이 없어요.</p>`;

        // 페이지 번호 출력
        if (totalPages <= 1) {
          paginationEl.innerHTML = "";
          return;
        }

        let paginationHTML = `
          <button
            type="button"
            class="diary-page-button"
            data-page="${currentPage - 1}"
            aria-label="이전 페이지"
            ${currentPage === 1 ? "disabled" : ""}
          >‹</button>
        `;

        for (let page = 1; page <= totalPages; page++) {
          paginationHTML += `
            <button
              type="button"
              class="diary-page-button ${page === currentPage ? "active" : ""}"
              data-page="${page}"
              ${page === currentPage ? 'aria-current="page"' : ""}
            >${page}</button>
          `;
        }

        paginationHTML += `
          <button
            type="button"
            class="diary-page-button"
            data-page="${currentPage + 1}"
            aria-label="다음 페이지"
            ${currentPage === totalPages ? "disabled" : ""}
          >›</button>
        `;

        paginationEl.innerHTML = paginationHTML;
      }

      /* 상세 글 출력 */
      async function renderDetail(id) {
        const post = diaryPosts.find((item) => String(item.id) === String(id));

        listView.hidden = true;
        detailEl.hidden = false;
        window.scrollTo(0, 0);

        if (!post) {
          detailEl.innerHTML = `
            <p class="diary-empty">게시글을 찾을 수 없습니다.</p>
            <button
              type="button"
              class="diary-back"
              id="diary-back"
            >← 목록으로</button>
          `;
          return;
        }

        detailEl.innerHTML = `
          <div class="diary-detail-category">
            ${escapeHTML(post.category)}
          </div>

          <h1>${escapeHTML(post.title)}</h1>

          <time
            class="diary-detail-date"
            datetime="${escapeHTML(post.date)}"
          >${formatDate(post.date)}</time>

          <div class="diary-detail-content" id="diary-content">
            불러오는 중...
          </div>

          <button
            type="button"
            class="diary-back"
            id="diary-back"
          >← 목록으로</button>
        `;

        try {
          const response = await fetch(`./${post.contentFile}`);

          if (!response.ok) {
            throw new Error("본문을 불러오지 못했습니다.");
          }

          const content = await response.text();
          const contentEl = document.getElementById("diary-content");

          if (contentEl) {
            contentEl.innerHTML = content;
          }
        } catch (error) {
          const contentEl = document.getElementById("diary-content");

          if (contentEl) {
            contentEl.textContent = "본문을 불러오지 못했습니다.";
          }

          console.error(error);
        }
      }

      /* 목록으로 돌아가기 */
      function showList(updateHistory = true) {
        detailEl.hidden = true;
        listView.hidden = false;

        if (updateHistory) {
          history.pushState({}, "", location.pathname);
        }

        window.scrollTo(0, 0);
      }

      /* 카테고리 클릭 */
      categoriesEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");

        if (!button) return;

        activeCategory = button.dataset.category;
        currentPage = 1;

        renderCategories();
        renderList();
      });

      /* 검색 */
      searchEl.addEventListener("input", () => {
        currentPage = 1;
        renderList();
      });

      /* 페이지 번호 클릭 */
      paginationEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-page]");

        if (!button || button.disabled) return;

        currentPage = Number(button.dataset.page);

        renderList();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      /* 게시글 클릭 */
      listEl.addEventListener("click", (event) => {
        const link = event.target.closest("[data-post-id]");

        if (!link) return;

        event.preventDefault();

        const id = link.dataset.postId;

        history.pushState(
          { diaryDetail: true },
          "",
          `?id=${encodeURIComponent(id)}`,
        );

        renderDetail(id);
      });

      /* 상세 글에서 목록으로 */
      detailEl.addEventListener("click", (event) => {
        if (event.target.closest("#diary-back")) {
          showList();
        }
      });

      /* 브라우저 뒤로 가기 / 앞으로 가기 */
      window.addEventListener("popstate", () => {
        const id = new URLSearchParams(location.search).get("id");

        if (id) {
          renderDetail(id);
        } else {
          showList(false);
        }
      });

      /* 초기 데이터 로딩 */
      async function init() {
        try {
          const response = await fetch("./diary.json");

          if (!response.ok) {
            throw new Error("diary.json을 불러오지 못했습니다.");
          }

          diaryPosts = await response.json();

          renderCategories();
          renderList();

          // 주소에 게시글 ID가 있으면 상세 글 표시
          const id = new URLSearchParams(location.search).get("id");

          if (id) {
            renderDetail(id);
          }
        } catch (error) {
          console.error(error);

          countEl.textContent = "TOTAL 0";

          listEl.innerHTML = `
            <p class="diary-empty">
              기록을 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.
            </p>
          `;

          paginationEl.innerHTML = "";
        }
      }

      init();
    </script>
  </body>
</html>
