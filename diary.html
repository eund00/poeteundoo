    <title>다이어리 : 은듀닷컴</title>

    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #292929;
        background: #fff;
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        line-height: 1.7;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .diary-page {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px 0;
      }
      @media (max-width: 1400px) {
        .diary-page {
          margin: 0 40px;
        }
      }

      /* 페이지 제목 */
      .diary-heading {
        margin-bottom: 55px;
      }

      .diary-label {
        margin: 0 0 12px;
        font-size: 12px;
        letter-spacing: 0.18em;
        color: #888;
      }

      .diary-heading h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(42px, 7vw, 64px);
        font-weight: 400;
        letter-spacing: -0.04em;
      }

      .diary-intro {
        margin-top: 18px;
        color: #777;
        font-size: 14px;
        word-break: keep-all;
      }

      /* 검색 */
      .diary-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
        padding-bottom: 18px;
        border-bottom: 1px dashed #739b73;
      }

      .diary-count {
        flex-shrink: 0;
        color: #888;
        font-size: 13px;
      }

      .diary-search {
        width: min(260px, 60%);
        outline: none;
        font-size: 13px;
        padding: 10px;
        border-radius: 3px;
        background-color: #cccccc20;
        border: none;
      }

      .diary-search:focus {
        border-color: #333;
      }

      /* 카테고리 */
      .diary-categories {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }

      .diary-category {
        padding: 5px 13px;
        border: 1px solid #e5e5e5;
        border-radius: 30px;
        background: #fff;
        color: #777;
        font-size: 12px;
      }

      .diary-category.active {
        border-color: #292929;
        background: #292929;
        color: #fff;
      }

      /* 게시글 목록 */
      .diary-list {
        border-top: 1px solid #292929;
      }

      .diary-item {
        display: grid;
        grid-template-columns: 100px minmax(0, 1fr);
        gap: 22px;
        padding: 27px 4px;
        border-bottom: 1px solid #eaeaea;
        transition: background 0.2s;
      }

      .diary-item:hover {
        background: #fafafa;
      }

      .diary-date {
        padding-top: 5px;
        color: #999;
        font-size: 12px;
        white-space: nowrap;
      }

      .diary-item-category {
        margin-bottom: 5px;
        color: #999;
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .diary-item h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.035em;
      }

      .diary-preview {
        display: -webkit-box;
        overflow: hidden;
        margin: 8px 0 0;
        color: #777;
        font-size: 13px;
        line-height: 1.8;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        white-space: pre-line;
      }

      .diary-empty {
        padding: 70px 0;
        color: #999;
        text-align: center;
        font-size: 14px;
      }

      /* 상세 글 */
      .diary-detail {
        padding: 15px 0;
      }

      .diary-back {
        margin-top: 5rem;
        font-size: 0.8rem;
        color: #999;
        padding: 0;
        border: 0;
        background: none;
      }

      .diary-detail-category {
        color: #999;
        font-size: 12px;
      }

      .diary-detail h1 {
        margin: 12px 0;
        font-size: clamp(26px, 5vw, 38px);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1.4;
        word-break: keep-all;
      }

      .diary-detail-date {
        color: #999;
        font-size: 12px;
      }

      .diary-detail-content {
        margin-top: 48px;
        padding-top: 35px;
        border-top: 1px solid #eaeaea;
        font-size: 15px;
        line-height: 2.1;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .diary-detail-content p {
        margin: 0 0 1.5em;
      }

      .diary-footer {
        margin-top: 75px;
        padding-top: 18px;
        border-top: 1px solid #eaeaea;
        color: #aaa;
        font-size: 11px;
        text-align: center;
      }

      @media (max-width: 600px) {
        .diary-page {
          padding-top: 45px;
        }

        .diary-heading {
          margin-bottom: 38px;
        }

        .diary-item {
          grid-template-columns: 1fr;
          gap: 6px;
          padding: 22px 2px;
        }

        .diary-date {
          padding: 0;
        }

        .diary-item h2 {
          font-size: 17px;
        }

        .diary-detail-content {
          margin-top: 35px;
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div class="modal">
      <div class="modal-in">
        <span style="font-size: 2rem">💌</span>
        <p>이 곳은 내 다이어리야. 비밀을 지켜야 해.</p>
        <div>
          <button id="modal-yes">응, 알겠어.</button>
          <button id="modal-no">싫어, 내가 왜?</button>
        </div>
      </div>
    </div>
    <style>
      .modal {
        position: fixed;
        width: 100vw;
        height: 100vh;
        background-color: #739b73;
        z-index: 999;
      }
      .modal-in {
        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        z-index: 1000;
        padding: 24px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }
      .modal-in > div {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
      }
    </style>
    <script>
      const modal = document.querySelector(".modal");
      const yesBtn = document.querySelector("#modal-yes");
      const noBtn = document.querySelector("#modal-no");

      yesBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });

      noBtn.addEventListener("click", () => {
        alert("흥, 나가!");
        history.back();
      });
    </script>

      <div class="header__inner">

          <a href="/">은듀닷컴</a>
        </h1>

    <main class="diary-page">
      <header class="diary-heading">
        <h1>Diary</h1>
        <p class="diary-intro">사부작사부작 . . . 뭔가 적긴하는 중</p>
      </header>

      <section id="diary-list-view">
        <div class="diary-tools">
          <span class="diary-count" id="diary-count"></span>
          <input
            class="diary-search"
            id="diary-search"
            type="search"
            placeholder="기록 검색하기"
            aria-label="기록 검색하기"
          />
        </div>

        <nav
          class="diary-categories"
          id="diary-categories"
          aria-label="카테고리 필터"
        ></nav>

        <div class="diary-list" id="diary-list"></div>
      </section>

      <article class="diary-detail" id="diary-detail" hidden></article>

      <footer class="diary-footer">© 2026 Lee Eun Joo</footer>
    </main>

    <script>
      let diaryPosts = [];
      let activeCategory = "전체";

      const listView = document.getElementById("diary-list-view");
      const listEl = document.getElementById("diary-list");
      const countEl = document.getElementById("diary-count");
      const searchEl = document.getElementById("diary-search");
      const categoriesEl = document.getElementById("diary-categories");
      const detailEl = document.getElementById("diary-detail");

      const formatDate = (date) => {
        const [year, month, day] = date.split("-");
        return `${year}.${month}.${day}`;
      };

      function escapeHTML(value = "") {
        return String(value).replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      }

      function getSortedPosts() {
        return [...diaryPosts].sort((a, b) => b.date.localeCompare(a.date));
      }

      function renderCategories() {
        const categories = [
          "전체",
          ...new Set(diaryPosts.map((post) => post.category)),
        ];

        categoriesEl.innerHTML = categories
          .map(
            (category) => `
      <button
        class="diary-category ${activeCategory === category ? "active" : ""}"
        data-category="${escapeHTML(category)}"
        aria-pressed="${activeCategory === category}"
      >${escapeHTML(category)}</button>
    `,
          )
          .join("");
      }

      function renderList() {
        const keyword = searchEl.value.trim().toLowerCase();

        const posts = getSortedPosts().filter((post) => {
          const matchesCategory =
            activeCategory === "전체" || post.category === activeCategory;

          const text = [post.title, post.preview, post.content, post.category]
            .join(" ")
            .toLowerCase();

          return matchesCategory && text.includes(keyword);
        });

        countEl.textContent = `TOTAL ${posts.length}`;

        listEl.innerHTML = posts.length
          ? posts
              .map(
                (post) => `
                <a
                class="diary-item"
                href="diary-detail.html?id=${encodeURIComponent(post.id)}"
                >
                <time>${formatDate(post.date)}</time>
                <div>
                    <h2>${escapeHTML(post.title)}</h2>
                    <p>${escapeHTML(post.preview)}</p>
                </div>
                </a>
            `,
              )
              .join("")
          : `<p class="diary-empty">아직 기록이 없어요.</p>`;
      }

      async function renderDetail(id) {
        const post = diaryPosts.find((item) => item.id === id);

        listView.hidden = true;
        detailEl.hidden = false;
        window.scrollTo(0, 0);

        if (!post) {
          detailEl.innerHTML = `
      <p class="diary-empty">게시글을 찾을 수 없습니다.</p>
      <button class="diary-back" id="diary-back">
        ← 목록으로
      </button>
    `;
          return;
        }

        detailEl.innerHTML = `
            <div class="diary-detail-category">
            ${escapeHTML(post.category)}
            </div>
            <h1>${escapeHTML(post.title)}</h1>
            <time class="diary-detail-date">
            ${formatDate(post.date)}
            </time>
            <div class="diary-detail-content" id="diary-content">
            불러오는 중...
            </div>
            <button class="diary-back" id="diary-back">
            ← 목록으로
            </button>
        `;

        try {
          const response = await fetch(`./${post.contentFile}`);

          if (!response.ok) {
            throw new Error("본문을 불러오지 못했습니다.");
          }

          const content = await response.text();

          document.getElementById("diary-content").textContent = content;
        } catch (error) {
          document.getElementById("diary-content").textContent =
            "본문을 불러오지 못했습니다.";
        }
      }

      function showList(updateHistory = true) {
        detailEl.hidden = true;
        listView.hidden = false;

        if (updateHistory) {
          history.pushState({}, "", location.pathname);
        }

        window.scrollTo(0, 0);
      }

      categoriesEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;

        activeCategory = button.dataset.category;
        renderCategories();
        renderList();
      });

      searchEl.addEventListener("input", renderList);

      listEl.addEventListener("click", (event) => {
        const link = event.target.closest("[data-post-id]");
        if (!link) return;

        event.preventDefault();

        const id = link.dataset.postId;
        history.pushState({}, "", `?id=${encodeURIComponent(id)}`);

        renderDetail(id);
      });

      detailEl.addEventListener("click", (event) => {
        if (event.target.closest("#diary-back")) {
          showList();
        }
      });

      window.addEventListener("popstate", () => {
        const id = new URLSearchParams(location.search).get("id");

        if (id) {
          renderDetail(id);
        } else {
          showList(false);
        }
      });

      async function init() {
        try {
          const response = await fetch("./diary.json");

          if (!response.ok) {
            throw new Error("diary.json을 불러오지 못했습니다.");
          }

          diaryPosts = await response.json();

          renderCategories();
          renderList();

          const id = new URLSearchParams(location.search).get("id");

          if (id) {
            renderDetail(id);
          }
        } catch (error) {
          console.error(error);
          listEl.innerHTML = `
        <p class="diary-empty">
          기록을 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.
        </p>
      `;
        }
      }

      init();
    </script>
  </body>
