<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 — 은듀닷컴</title>
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu&family=Gothic+A1&family=IBM+Plex+Sans+KR&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #f7f6f2;
        --surface: #fff;
        --border: #d8d5cc;
        --ink: #171713;
        --accent: #739b73;
        --accent-dark: #4f6b4f;
        --muted: #77776f;
        --danger: #9a4f49;
        --success-bg: #edf3eb;
        --danger-bg: #fbefed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 48px 24px 80px;
        background: var(--bg);
        color: var(--ink);
        font-family: "돋움", Dotum, sans-serif;
        line-height: 1.65;
      }

      .container {
        max-width: 920px;
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid var(--ink);
        padding-bottom: 20px;
        margin-bottom: 24px;
      }

      header h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 400;
        letter-spacing: -0.05em;
      }

      .header-actions {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      .admin-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }

      .tab-btn {
        width: auto;
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 9px 18px;
        font-size: 0.92rem;
        font-weight: 400;
      }

      .tab-btn:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      .tab-btn.active {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
        font-weight: 600;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: clamp(18px, 3vw, 28px);
        margin-bottom: 24px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--ink);
      }

      .section-header h2 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 400;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button.section-toggle {
        width: auto;
        padding: 2px 4px;
        background: none;
        color: var(--muted);
        font-size: 1.5rem;
        line-height: 1;
      }

      button.section-toggle:hover {
        color: var(--ink);
      }

      .works-list {
        max-height: 360px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 4px;
      }

      .work-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 10px 12px;
        font-size: 0.92rem;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
      }

      .work-item.editing {
        border-color: var(--accent-dark);
        background: var(--success-bg);
      }

      .work-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .work-id {
        color: var(--accent-dark);
        font-weight: 600;
        flex-shrink: 0;
      }

      .work-title {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .work-sub {
        color: var(--muted);
        font-size: 0.82rem;
        flex-shrink: 0;
      }

      .badge-private {
        font-size: 0.75rem;
        padding: 2px 7px;
        border: 1px solid var(--border);
        color: var(--muted);
        flex-shrink: 0;
      }

      .item-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .field {
        margin-bottom: 16px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      @media (max-width: 540px) {
        .row {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }

      label {
        display: block;
        font-size: 0.88rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      label span.req {
        color: var(--danger);
        margin-left: 3px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      select,
      textarea {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--ink);
        padding: 11px 12px;
        font-size: 0.95rem;
        font-family: inherit;
        line-height: inherit;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      input::placeholder,
      textarea::placeholder {
        color: #a09e96;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent-dark);
        box-shadow: 0 0 0 3px rgba(115, 155, 115, 0.16);
      }

      input:read-only {
        background: var(--bg);
        cursor: not-allowed;
      }

      textarea {
        min-height: 260px;
        resize: vertical;
        line-height: 2;
      }

      .upload-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--bg);
        border: 1px dashed var(--border);
        padding: 12px;
      }

      .upload-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      input[type="file"] {
        font-size: 0.85rem;
        font-family: inherit;
        color: var(--ink);
      }

      .img-preview {
        max-width: 180px;
        max-height: 180px;
        border: 1px solid var(--border);
        background: var(--surface);
        object-fit: cover;
        display: none;
      }

      .img-preview.show {
        display: block;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 18px 0;
      }

      .checkbox-row input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      .checkbox-row label {
        margin: 0;
        color: var(--ink);
        cursor: pointer;
      }

      button {
        background: var(--accent);
        color: var(--ink);
        border: none;
        padding: 12px 18px;
        font-size: 0.95rem;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease;
        width: 100%;
        color: #fff;
        font-family: "Gothic A1";
        font-weight: inherit;
        font-size: 1rem;
      }

      button:focus-visible {
        outline: 2px solid var(--accent-dark);
        outline-offset: 3px;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      button.secondary {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--border);
        padding: 7px 11px;
        font-size: 0.84rem;
        font-weight: 400;
        width: auto;
      }

      button.secondary:hover {
        background: var(--bg);
        color: var(--ink);
        border-color: var(--ink);
      }

      button.danger {
        border: 1px solid #d9b8b3;
        padding: 7px 11px;
        font-size: 0.84rem;
        font-weight: 400;
        width: auto;
        background-color: var(--danger);
        color: #fff;
      }

      button.danger:hover {
        background: var(--danger-bg);
        color: var(--danger);
        border-color: var(--danger);
      }

      .status {
        margin-top: 14px;
        font-size: 0.88rem;
        padding: 10px 12px;
        display: none;
      }

      .status.ok {
        display: block;
        background: var(--success-bg);
        border: 1px solid #b9cbb5;
        color: var(--accent-dark);
      }

      .status.err {
        display: block;
        background: var(--danger-bg);
        border: 1px solid #d9b8b3;
        color: var(--danger);
      }

      .hidden {
        display: none !important;
      }

      .hint {
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 4px;
      }

      @media (max-width: 640px) {
        body {
          padding: 28px 14px 48px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 20px;
        }

        .work-item {
          align-items: flex-start;
          flex-wrap: wrap;
        }

        .work-meta {
          flex: 1 1 100%;
        }

        .item-actions {
          justify-content: flex-end;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <a href="/" style="text-decoration: none">🍀</a> 은듀닷컴 관리자
        </h1>
        <div class="header-actions">
          <button id="logoutBtn" class="secondary hidden" type="button">
            로그아웃
          </button>
        </div>
      </header>

      <div style="margin-bottom: 20px; border: 1px solid #000; padding: 1rem">
        * 사용 가능 폰트 클래스 *
        <br />
        <div>
          .font-gaegu
          <span class="font-gaegu" style="padding-left: 10px"
            >gaegu폰트입니다. 0123</span
          >
        </div>
        <div>
          .font-a1
          <span class="font-a1" style="padding-left: 10px"
            >고딕 A1폰트입니다. 0123</span
          >
        </div>
        <div>
          .font-ibm
          <span class="font-ibm" style="padding-left: 10px"
            >font-ibm폰트입니다. 0123</span
          >
        </div>
      </div>

      <!-- 1. 로그인 화면 -->
      <section id="loginSection" class="card">
        <form id="loginForm">
          <div class="field">
            <label for="admin-email">관리자 이메일</label>
            <input
              type="email"
              id="admin-email"
              autocomplete="email"
              required
              placeholder="admin@example.com"
            />
          </div>
          <div class="field">
            <label for="admin-password">비밀번호</label>
            <input
              type="password"
              id="admin-password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
            />
          </div>
          <button type="submit" id="loginBtn">로그인</button>
          <div id="loginStatus" class="status"></div>
        </form>
      </section>

      <!-- 로그인 성공 시 표시되는 영역 -->
      <div id="adminArea" class="hidden">
        <!-- 탭 전환 버튼 -->
        <nav class="admin-tabs" aria-label="관리 메뉴 전환">
          <button
            type="button"
            class="tab-btn active"
            data-tab="works"
            id="tabWorksBtn"
          >
            작품 관리 (works)
          </button>
          <button
            type="button"
            class="tab-btn"
            data-tab="memory"
            id="tabMemoryBtn"
          >
            물건기억소 (memory_items)
          </button>
        </nav>

        <!-- ==================== [탭 1] 작품 관리 (works) ==================== -->
        <div id="panel-works">
          <section class="card">
            <div class="section-header">
              <div class="section-title">
                <button
                  type="button"
                  id="worksListToggle"
                  class="section-toggle"
                  aria-expanded="true"
                  aria-controls="worksList"
                  aria-label="등록된 작품 목록 접기"
                >
                  🔼
                </button>
                <h2 id="listTitle">등록된 작품 목록</h2>
              </div>
              <button type="button" id="newModeBtn" class="secondary">
                + 새 작품 작성 모드
              </button>
            </div>
            <div id="worksList" class="works-list">
              <div class="hint">목록을 불러오는 중...</div>
            </div>
          </section>

          <section class="card">
            <div class="section-header">
              <div class="section-title">
                <button
                  type="button"
                  id="workFormToggle"
                  class="section-toggle"
                  aria-expanded="true"
                  aria-controls="workForm"
                  aria-label="작품 등록 폼 접기"
                >
                  🔼
                </button>
                <h2 id="formModeTitle">새 작품 등록</h2>
              </div>
              <button type="button" id="cancelEditBtn" class="secondary hidden">
                수정 취소
              </button>
            </div>

            <form id="workForm">
              <div class="row">
                <div class="field">
                  <label for="work-id"
                    >발표 순서 ID <span class="req">*</span></label
                  >
                  <input
                    type="text"
                    id="work-id"
                    required
                    placeholder="예: 34"
                  />
                  <div class="hint" id="idHint">
                    기존 데이터 개수를 확인 중...
                  </div>
                </div>
                <div class="field">
                  <label for="work-year">발표 연도</label>
                  <input type="text" id="work-year" placeholder="2026" />
                </div>
              </div>

              <div class="field">
                <label for="work-title">제목 <span class="req">*</span></label>
                <input
                  type="text"
                  id="work-title"
                  required
                  placeholder="작품 제목을 입력하세요"
                />
              </div>

              <div class="field">
                <label for="work-subtitle">부제</label>
                <input
                  type="text"
                  id="work-subtitle"
                  placeholder="부제가 있을 경우 입력"
                />
              </div>

              <div class="row">
                <div class="field">
                  <label for="work-kind">갈래 (kind)</label>
                  <input
                    type="text"
                    id="work-kind"
                    value="시"
                    placeholder="시 / 산문 / 엽편소설"
                  />
                </div>
                <div class="field">
                  <label for="work-publication">발표 지면 / 시집</label>
                  <input
                    type="text"
                    id="work-publication"
                    placeholder="예: 포엠피플 2026 여름호"
                  />
                </div>
              </div>

              <div class="field">
                <label for="work-content"
                  >본문 <span class="req">*</span></label
                >
                <textarea
                  id="work-content"
                  required
                  placeholder="여기에 시 본문을 붙여넣으세요. 줄바꿈과 연 구분이 그대로 저장됩니다."
                ></textarea>
              </div>

              <div class="field">
                <label for="work-img-file"
                  >이미지 첨부 (images 버킷 자동 업로드)</label
                >
                <div class="upload-box">
                  <div class="upload-controls">
                    <input type="file" id="work-img-file" accept="image/*" />
                    <span class="hint" id="work-upload-status"></span>
                  </div>
                  <img
                    id="work-img-preview"
                    class="img-preview"
                    alt="미리보기"
                  />
                  <input
                    type="text"
                    id="work-img"
                    placeholder="파일을 선택하면 URL이 자동 입력됩니다 (직접 입력도 가능)"
                  />
                </div>
              </div>

              <div class="field">
                <label for="work-link">외부 링크 URL (선택)</label>
                <input type="text" id="work-link" placeholder="https://..." />
              </div>

              <div class="checkbox-row">
                <input type="checkbox" id="work-published" checked />
                <label for="work-published"
                  >즉시 공개 (체크 해제 시 비공개 저장)</label
                >
              </div>

              <button type="submit" id="submitBtn">
                서버에 새 작품 등록하기
              </button>
              <div id="formStatus" class="status"></div>
            </form>
          </section>
        </div>

        <!-- ==================== [탭 2] 물건기억소 (memory_items) ==================== -->
        <div id="panel-memory" class="hidden">
          <section class="card">
            <div class="section-header">
              <div class="section-title">
                <button
                  type="button"
                  id="memListToggle"
                  class="section-toggle"
                  aria-expanded="true"
                  aria-controls="memList"
                  aria-label="등록된 물건 목록 접기"
                >
                  🔼
                </button>
                <h2 id="memListTitle">물건기억소 목록</h2>
              </div>
              <button type="button" id="newMemModeBtn" class="secondary">
                + 새 물건 기록 모드
              </button>
            </div>
            <div id="memList" class="works-list">
              <div class="hint">목록을 불러오는 중...</div>
            </div>
          </section>

          <section class="card">
            <div class="section-header">
              <div class="section-title">
                <button
                  type="button"
                  id="memFormToggle"
                  class="section-toggle"
                  aria-expanded="true"
                  aria-controls="memForm"
                  aria-label="물건 등록 폼 접기"
                >
                  🔼
                </button>
                <h2 id="memFormModeTitle">새 물건 기억 등록</h2>
              </div>
              <button
                type="button"
                id="cancelMemEditBtn"
                class="secondary hidden"
              >
                수정 취소
              </button>
            </div>

            <form id="memForm">
              <div class="row">
                <div class="field">
                  <label for="mem-title"
                    >물건 이름 (title) <span class="req">*</span></label
                  >
                  <input
                    type="text"
                    id="mem-title"
                    required
                    placeholder="예: 초록색 다마고치"
                  />
                </div>
                <div class="field">
                  <label for="mem-has-item"
                    >구분 (has_item · 이모지만 저장)</label
                  >
                  <select id="mem-has-item">
                    <option value="">선택 안 함</option>
                    <option value="🎁">🎁 선물</option>
                    <option value="🛍️">🛍️ 구매</option>
                    <option value="🤝">🤝 양도</option>
                    <option value="🪡">🪡 제작</option>
                  </select>
                </div>
              </div>

              <div class="field">
                <label for="mem-image-file"
                  >사진 첨부 (images 버킷 자동 업로드)</label
                >
                <div class="upload-box">
                  <div class="upload-controls">
                    <input type="file" id="mem-image-file" accept="image/*" />
                    <span class="hint" id="mem-upload-status"></span>
                  </div>
                  <img
                    id="mem-image-preview"
                    class="img-preview"
                    alt="미리보기"
                  />
                  <input
                    type="text"
                    id="mem-image"
                    placeholder="사진 파일을 선택하면 URL이 자동 입력됩니다 (직접 입력도 가능)"
                  />
                </div>
              </div>

              <div class="field">
                <label for="mem-description"
                  >기억의 기록 (description) <span class="req">*</span></label
                >
                <textarea
                  id="mem-description"
                  required
                  placeholder="이 물건에 얽힌 기억과 이야기를 기록하세요."
                ></textarea>
              </div>

              <div class="checkbox-row">
                <input type="checkbox" id="mem-visible" checked />
                <label for="mem-visible"
                  >즉시 공개 (visible — 체크 해제 시 비공개)</label
                >
              </div>

              <button type="submit" id="memSubmitBtn">
                물건기억소에 등록하기
              </button>
              <div id="memFormStatus" class="status"></div>
            </form>
          </section>
        </div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://jxyucxgpdlfidzwizski.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_hhdmoi0xScMatNS8Nb9ZVA_FG-DQoG-";
      const STORAGE_BUCKET = "images";

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const loginSection = document.getElementById("loginSection");
      const adminArea = document.getElementById("adminArea");
      const logoutBtn = document.getElementById("logoutBtn");
      const loginForm = document.getElementById("loginForm");
      const loginStatus = document.getElementById("loginStatus");

      // 탭 전환 요소
      const tabWorksBtn = document.getElementById("tabWorksBtn");
      const tabMemoryBtn = document.getElementById("tabMemoryBtn");
      const panelWorks = document.getElementById("panel-works");
      const panelMemory = document.getElementById("panel-memory");

      // [작품 관리] 요소
      const workForm = document.getElementById("workForm");
      const formStatus = document.getElementById("formStatus");
      const worksListEl = document.getElementById("worksList");
      const listTitleEl = document.getElementById("listTitle");
      const worksListToggle = document.getElementById("worksListToggle");
      const workFormToggle = document.getElementById("workFormToggle");
      const formModeTitle = document.getElementById("formModeTitle");
      const cancelEditBtn = document.getElementById("cancelEditBtn");
      const newModeBtn = document.getElementById("newModeBtn");
      const submitBtn = document.getElementById("submitBtn");
      const idInput = document.getElementById("work-id");
      const idHint = document.getElementById("idHint");

      // [물건기억소] 요소
      const memForm = document.getElementById("memForm");
      const memFormStatus = document.getElementById("memFormStatus");
      const memListEl = document.getElementById("memList");
      const memListTitleEl = document.getElementById("memListTitle");
      const memListToggle = document.getElementById("memListToggle");
      const memFormToggle = document.getElementById("memFormToggle");
      const memFormModeTitle = document.getElementById("memFormModeTitle");
      const cancelMemEditBtn = document.getElementById("cancelMemEditBtn");
      const newMemModeBtn = document.getElementById("newMemModeBtn");
      const memSubmitBtn = document.getElementById("memSubmitBtn");

      let allWorks = [];
      let editingId = null;

      let allMemoryItems = [];
      let editingMemId = null;

      // =========================================================
      // 공통 이미지 업로드 및 미리보기 핸들러
      // =========================================================
      function updatePreview(previewEl, url) {
        if (url && url.trim()) {
          previewEl.src = url.trim();
          previewEl.classList.add("show");
        } else {
          previewEl.removeAttribute("src");
          previewEl.classList.remove("show");
        }
      }

      function setupImageUploader({
        fileInputId,
        urlInputId,
        statusId,
        previewId,
      }) {
        const fileInput = document.getElementById(fileInputId);
        const urlInput = document.getElementById(urlInputId);
        const statusEl = document.getElementById(statusId);
        const previewEl = document.getElementById(previewId);

        urlInput.addEventListener("input", () => {
          updatePreview(previewEl, urlInput.value);
        });

        fileInput.addEventListener("change", async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;

          const now = new Date();
          const yyyy = now.getFullYear();
          const mm = String(now.getMonth() + 1).padStart(2, "0");
          const dd = String(now.getDate()).padStart(2, "0");
          const ext = file.name.split(".").pop()?.toLowerCase() || "jpg";
          const rand = Math.random().toString(36).substring(2, 8);
          const fileName = `${yyyy}.${mm}.${dd}_${rand}.${ext}`;

          statusEl.textContent = "Storage에 업로드 중...";
          statusEl.style.color = "var(--accent-dark)";

          const { error: uploadError } = await sb.storage
            .from(STORAGE_BUCKET)
            .upload(fileName, file, {
              cacheControl: "3600",
              upsert: false,
            });

          if (uploadError) {
            statusEl.textContent = `업로드 실패: ${uploadError.message}`;
            statusEl.style.color = "var(--danger)";
            return;
          }

          const { data: publicData } = sb.storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(fileName);

          const publicUrl = publicData.publicUrl;
          urlInput.value = publicUrl;
          updatePreview(previewEl, publicUrl);
          statusEl.textContent = `업로드 완료 (${fileName})`;
          statusEl.style.color = "var(--accent-dark)";
        });
      }

      setupImageUploader({
        fileInputId: "work-img-file",
        urlInputId: "work-img",
        statusId: "work-upload-status",
        previewId: "work-img-preview",
      });

      setupImageUploader({
        fileInputId: "mem-image-file",
        urlInputId: "mem-image",
        statusId: "mem-upload-status",
        previewId: "mem-image-preview",
      });

      // 탭 전환 로직
      function switchTab(tabName) {
        const isWorks = tabName === "works";
        tabWorksBtn.classList.toggle("active", isWorks);
        tabMemoryBtn.classList.toggle("active", !isWorks);
        panelWorks.classList.toggle("hidden", !isWorks);
        panelMemory.classList.toggle("hidden", isWorks);
      }

      tabWorksBtn.addEventListener("click", () => switchTab("works"));
      tabMemoryBtn.addEventListener("click", () => switchTab("memory"));

      // 접기/펼치기 공통 유틸
      function setSectionExpanded(toggle, content, expanded, label) {
        content.classList.toggle("hidden", !expanded);
        toggle.setAttribute("aria-expanded", String(expanded));
        toggle.setAttribute(
          "aria-label",
          `${label} ${expanded ? "접기" : "펼치기"}`,
        );
        toggle.textContent = expanded ? "🔼" : "🔽";
      }

      worksListToggle.addEventListener("click", () => {
        const expanded =
          worksListToggle.getAttribute("aria-expanded") !== "true";
        setSectionExpanded(
          worksListToggle,
          worksListEl,
          expanded,
          "등록된 작품 목록",
        );
      });

      workFormToggle.addEventListener("click", () => {
        const expanded =
          workFormToggle.getAttribute("aria-expanded") !== "true";
        setSectionExpanded(workFormToggle, workForm, expanded, "작품 등록 폼");
      });

      memListToggle.addEventListener("click", () => {
        const expanded = memListToggle.getAttribute("aria-expanded") !== "true";
        setSectionExpanded(
          memListToggle,
          memListEl,
          expanded,
          "물건기억소 목록",
        );
      });

      memFormToggle.addEventListener("click", () => {
        const expanded = memFormToggle.getAttribute("aria-expanded") !== "true";
        setSectionExpanded(memFormToggle, memForm, expanded, "물건 등록 폼");
      });

      document.getElementById("work-year").value = new Date()
        .getFullYear()
        .toString();

      function showStatus(el, msg, isError = false) {
        el.textContent = msg;
        el.className = "status " + (isError ? "err" : "ok");
      }

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(str) {
        return String(str ?? "").replace(/'/g, "\\'");
      }

      // =========================================================
      // 1. 작품 관리 (works) 기능
      // =========================================================
      async function loadWorks() {
        const { data, error } = await sb
          .from("works")
          .select("*")
          .order("id", { ascending: false });

        if (error) {
          worksListEl.innerHTML = `<div class="hint">목록 조회 오류: ${error.message}</div>`;
          return;
        }

        allWorks = data || [];
        listTitleEl.textContent = `등록된 작품 목록 (${allWorks.length}편)`;
        renderWorksList();

        if (!editingId) {
          suggestNextId();
        }
      }

      function renderWorksList() {
        if (allWorks.length === 0) {
          worksListEl.innerHTML =
            '<div class="hint">등록된 작품이 없습니다.</div>';
          return;
        }

        worksListEl.innerHTML = allWorks
          .map((work) => {
            const isEditing = editingId === work.id;
            const privateBadge =
              work.is_published === false
                ? '<span class="badge-private">비공개</span>'
                : "";
            const pubText = work.publication ? ` · ${work.publication}` : "";
            return `
          <div class="work-item ${isEditing ? "editing" : ""}">
            <div class="work-meta">
              <span class="work-id">#${escapeHtml(work.id)}</span>
              <span class="work-title">${escapeHtml(work.title)}</span>
              <span class="work-sub">${escapeHtml((work.year || "") + pubText)}</span>
              ${privateBadge}
            </div>
            <div class="item-actions">
              <button type="button" class="secondary" onclick="startEdit('${escapeAttr(work.id)}')">수정</button>
              <button type="button" class="danger" onclick="deleteWork('${escapeAttr(work.id)}')">삭제</button>
            </div>
          </div>
        `;
          })
          .join("");
      }

      function suggestNextId() {
        const numericIds = allWorks
          .map((row) => parseInt(row.id, 10))
          .filter((num) => !isNaN(num));

        if (numericIds.length > 0) {
          const nextNum = Math.max(...numericIds) + 1;
          const formatted =
            nextNum < 10 ? String(nextNum).padStart(2, "0") : String(nextNum);
          idInput.value = formatted;
          idHint.textContent = `자동 추천 다음 번호: ${formatted}`;
        } else {
          idInput.value = "01";
          idHint.textContent = "첫 작품 번호: 01";
        }
      }

      window.startEdit = function (id) {
        const target = allWorks.find((w) => String(w.id) === String(id));
        if (!target) return;

        editingId = target.id;
        formModeTitle.textContent = `작품 수정 중 (#${target.id} · ${target.title})`;
        cancelEditBtn.classList.remove("hidden");
        submitBtn.textContent = "수정 내용 저장하기";
        formStatus.className = "status";

        idInput.value = target.id;
        idInput.readOnly = true;
        idHint.textContent = "수정 모드에서는 기존 순서 ID가 고정됩니다.";

        document.getElementById("work-title").value = target.title || "";
        document.getElementById("work-year").value = target.year || "";
        document.getElementById("work-kind").value = target.kind || "";
        document.getElementById("work-publication").value =
          target.publication || "";
        document.getElementById("work-subtitle").value = target.subtitle || "";
        document.getElementById("work-content").value = target.content || "";
        document.getElementById("work-img").value = target.img || "";
        document.getElementById("work-img-file").value = "";
        document.getElementById("work-upload-status").textContent = "";
        updatePreview(document.getElementById("work-img-preview"), target.img);

        document.getElementById("work-link").value = target.link || "";
        document.getElementById("work-published").checked =
          target.is_published !== false;

        renderWorksList();
        setSectionExpanded(workFormToggle, workForm, true, "작품 등록 폼");
        formModeTitle.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      function resetToCreateMode() {
        editingId = null;
        formModeTitle.textContent = "새 작품 등록";
        cancelEditBtn.classList.add("hidden");
        submitBtn.textContent = "서버에 새 작품 등록하기";

        idInput.readOnly = false;
        document.getElementById("work-title").value = "";
        document.getElementById("work-subtitle").value = "";
        document.getElementById("work-content").value = "";
        document.getElementById("work-img").value = "";
        document.getElementById("work-img-file").value = "";
        document.getElementById("work-upload-status").textContent = "";
        updatePreview(document.getElementById("work-img-preview"), "");

        document.getElementById("work-link").value = "";
        document.getElementById("work-published").checked = true;

        suggestNextId();
        renderWorksList();
      }

      cancelEditBtn.addEventListener("click", () => {
        formStatus.className = "status";
        resetToCreateMode();
      });

      newModeBtn.addEventListener("click", () => {
        formStatus.className = "status";
        resetToCreateMode();
        setSectionExpanded(workFormToggle, workForm, true, "작품 등록 폼");
        formModeTitle.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      window.deleteWork = async function (id) {
        const target = allWorks.find((w) => String(w.id) === String(id));
        const label = target ? `[#${target.id}] ${target.title}` : id;
        if (
          !confirm(
            `정말 「${label}」 작품을 삭제할까요?\n삭제 후에는 복구할 수 없습니다.`,
          )
        ) {
          return;
        }

        const { error } = await sb.from("works").delete().eq("id", id);
        if (error) {
          alert("삭제 오류: " + error.message);
          return;
        }

        if (String(editingId) === String(id)) {
          resetToCreateMode();
        }
        showStatus(formStatus, `「${label}」 작품이 삭제되었습니다.`);
        await loadWorks();
      };

      workForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;

        const payload = {
          title: document.getElementById("work-title").value.trim(),
          year: document.getElementById("work-year").value.trim() || null,
          kind: document.getElementById("work-kind").value.trim() || null,
          publication:
            document.getElementById("work-publication").value.trim() || null,
          subtitle:
            document.getElementById("work-subtitle").value.trim() || null,
          img: document.getElementById("work-img").value.trim() || null,
          link: document.getElementById("work-link").value.trim() || null,
          content: document.getElementById("work-content").value,
          is_published: document.getElementById("work-published").checked,
        };

        if (editingId) {
          submitBtn.textContent = "수정 사항 저장 중...";
          const { error } = await sb
            .from("works")
            .update(payload)
            .eq("id", editingId);

          submitBtn.disabled = false;
          if (error) {
            submitBtn.textContent = "수정 내용 저장하기";
            showStatus(formStatus, "수정 오류: " + error.message, true);
          } else {
            showStatus(
              formStatus,
              `「${payload.title}」 수정이 완료되었습니다!`,
            );
            resetToCreateMode();
            await loadWorks();
          }
        } else {
          submitBtn.textContent = "새 작품 등록 중...";
          const insertPayload = { id: idInput.value.trim(), ...payload };
          const { error } = await sb.from("works").insert([insertPayload]);

          submitBtn.disabled = false;
          if (error) {
            submitBtn.textContent = "서버에 새 작품 등록하기";
            showStatus(formStatus, "등록 오류: " + error.message, true);
          } else {
            showStatus(
              formStatus,
              `「${payload.title}」 작품이 성공적으로 등록되었습니다!`,
            );
            resetToCreateMode();
            await loadWorks();
          }
        }
      });

      // =========================================================
      // 2. 물건기억소 (memory_items) 기능
      // =========================================================
      async function loadMemoryItems() {
        const { data, error } = await sb
          .from("memory_items")
          .select("*")
          .order("id", { ascending: false });

        if (error) {
          memListEl.innerHTML = `<div class="hint">물건기억소 조회 오류: ${error.message}</div>`;
          return;
        }

        allMemoryItems = data || [];
        memListTitleEl.textContent = `물건기억소 목록 (${allMemoryItems.length}개)`;
        renderMemoryList();
      }

      function renderMemoryList() {
        if (allMemoryItems.length === 0) {
          memListEl.innerHTML =
            '<div class="hint">등록된 물건 기억이 없습니다.</div>';
          return;
        }

        memListEl.innerHTML = allMemoryItems
          .map((item) => {
            const isEditing = editingMemId === item.id;
            const privateBadge =
              item.visible === false
                ? '<span class="badge-private">비공개</span>'
                : "";
            const emojiBadge = item.has_item ? `${item.has_item} ` : "";
            const dateStr = item.created_at
              ? new Date(item.created_at).toLocaleDateString("ko-KR")
              : "";
            return `
          <div class="work-item ${isEditing ? "editing" : ""}">
            <div class="work-meta">
              <span class="work-id">#${escapeHtml(item.id)}</span>
              <span class="work-title">${escapeHtml(emojiBadge + (item.title || "(제목 없음)"))}</span>
              <span class="work-sub">${escapeHtml(dateStr)}</span>
              ${privateBadge}
            </div>
            <div class="item-actions">
              <button type="button" class="secondary" onclick="startEditMem(${item.id})">수정</button>
              <button type="button" class="danger" onclick="deleteMem(${item.id})">삭제</button>
            </div>
          </div>
        `;
          })
          .join("");
      }

      window.startEditMem = function (id) {
        const target = allMemoryItems.find((m) => m.id === id);
        if (!target) return;

        editingMemId = target.id;
        memFormModeTitle.textContent = `물건 수정 중 (#${target.id} · ${target.title || "제목 없음"})`;
        cancelMemEditBtn.classList.remove("hidden");
        memSubmitBtn.textContent = "수정 내용 저장하기";
        memFormStatus.className = "status";

        document.getElementById("mem-title").value = target.title || "";

        // 기존 값에 텍스트가 섞여 있어도 이모지만 추출해 select 옵션과 매칭
        const hasSelect = document.getElementById("mem-has-item");
        const rawVal = (target.has_item || "").trim();
        const matchedEmoji = ["🎁", "🛍️", "🤝", "🪡"].find((em) =>
          rawVal.includes(em),
        );
        hasSelect.value = matchedEmoji || "";

        document.getElementById("mem-image").value = target.image || "";
        document.getElementById("mem-image-file").value = "";
        document.getElementById("mem-upload-status").textContent = "";
        updatePreview(
          document.getElementById("mem-image-preview"),
          target.image,
        );

        document.getElementById("mem-description").value =
          target.description || "";
        document.getElementById("mem-visible").checked =
          target.visible !== false;

        renderMemoryList();
        setSectionExpanded(memFormToggle, memForm, true, "물건 등록 폼");
        memFormModeTitle.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      function resetMemToCreateMode() {
        editingMemId = null;
        memFormModeTitle.textContent = "새 물건 기억 등록";
        cancelMemEditBtn.classList.add("hidden");
        memSubmitBtn.textContent = "물건기억소에 등록하기";

        document.getElementById("mem-title").value = "";
        document.getElementById("mem-has-item").value = "";
        document.getElementById("mem-image").value = "";
        document.getElementById("mem-image-file").value = "";
        document.getElementById("mem-upload-status").textContent = "";
        updatePreview(document.getElementById("mem-image-preview"), "");

        document.getElementById("mem-description").value = "";
        document.getElementById("mem-visible").checked = true;

        renderMemoryList();
      }

      cancelMemEditBtn.addEventListener("click", () => {
        memFormStatus.className = "status";
        resetMemToCreateMode();
      });

      newMemModeBtn.addEventListener("click", () => {
        memFormStatus.className = "status";
        resetMemToCreateMode();
        setSectionExpanded(memFormToggle, memForm, true, "물건 등록 폼");
        memFormModeTitle.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      window.deleteMem = async function (id) {
        const target = allMemoryItems.find((m) => m.id === id);
        const label = target
          ? `[#${target.id}] ${target.title || "제목 없음"}`
          : id;
        if (
          !confirm(
            `정말 「${label}」 물건 기록을 삭제할까요?\n삭제 후에는 복구할 수 없습니다.`,
          )
        ) {
          return;
        }

        const { error } = await sb.from("memory_items").delete().eq("id", id);
        if (error) {
          alert("삭제 오류: " + error.message);
          return;
        }

        if (editingMemId === id) {
          resetMemToCreateMode();
        }
        showStatus(memFormStatus, `「${label}」 기록이 삭제되었습니다.`);
        await loadMemoryItems();
      };

      memForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        memSubmitBtn.disabled = true;

        // select의 value(🎁, 🛍️, 🤝, 🪡)만 저장됨
        const selectedEmoji = document.getElementById("mem-has-item").value;

        const payload = {
          title: document.getElementById("mem-title").value.trim(),
          has_item: selectedEmoji || null,
          image: document.getElementById("mem-image").value.trim() || null,
          description: document.getElementById("mem-description").value,
          visible: document.getElementById("mem-visible").checked,
        };

        if (editingMemId !== null) {
          memSubmitBtn.textContent = "수정 사항 저장 중...";
          const { error } = await sb
            .from("memory_items")
            .update(payload)
            .eq("id", editingMemId);

          memSubmitBtn.disabled = false;
          if (error) {
            memSubmitBtn.textContent = "수정 내용 저장하기";
            showStatus(memFormStatus, "수정 오류: " + error.message, true);
          } else {
            showStatus(
              memFormStatus,
              `「${payload.title}」 수정이 완료되었습니다!`,
            );
            resetMemToCreateMode();
            await loadMemoryItems();
          }
        } else {
          memSubmitBtn.textContent = "물건기억소에 등록 중...";
          const { error } = await sb.from("memory_items").insert([payload]);

          memSubmitBtn.disabled = false;
          if (error) {
            memSubmitBtn.textContent = "물건기억소에 등록하기";
            showStatus(memFormStatus, "등록 오류: " + error.message, true);
          } else {
            showStatus(
              memFormStatus,
              `「${payload.title}」 물건 기억이 등록되었습니다!`,
            );
            resetMemToCreateMode();
            await loadMemoryItems();
          }
        }
      });

      // =========================================================
      // 3. 인증 세션 관리
      // =========================================================
      async function checkSession() {
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (session) {
          loginSection.classList.add("hidden");
          adminArea.classList.remove("hidden");
          logoutBtn.classList.remove("hidden");
          loadWorks();
          loadMemoryItems();
        } else {
          loginSection.classList.remove("hidden");
          adminArea.classList.add("hidden");
          logoutBtn.classList.add("hidden");
        }
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("admin-email").value.trim();
        const password = document.getElementById("admin-password").value;

        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showStatus(loginStatus, "로그인 실패: " + error.message, true);
        } else {
          loginStatus.className = "status";
          checkSession();
        }
      });

      logoutBtn.addEventListener("click", async () => {
        await sb.auth.signOut();
        checkSession();
      });

      checkSession();
    </script>
  </body>
</html>
